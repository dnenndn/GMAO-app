<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stock GMAO</title>

<!-- Android / Chrome install -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16211c" />

<!-- iOS / Safari install (Safari ignores the manifest for these bits) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stock GMAO" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<style>
  :root {
    --ink: #221f1c;
    --paper: #f7f5f2;
    --panel: #ffffff;
    --panel-2: #f1ede8;
    --line: #e7e1da;
    --accent: #b8451f;
    --accent-ink: #ffffff;
    --success: #2f8f57;
    --success-ink: #ffffff;
    --warn: #b8721f;
    --warn-bg: rgba(184, 114, 31, 0.10);
    --warn-border: rgba(184, 114, 31, 0.35);
    --warn-icon-bg: rgba(184, 114, 31, 0.20);
    --danger: #b83f36;
    --danger-ink: #ffffff;
    --muted: #746b64;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f2f0ed;
      --paper: #0e0e10;
      --panel: #1a1a1d;
      --panel-2: #222225;
      --line: #2b2a2c;
      --accent: #d1592f;
      --accent-ink: #fff7f2;
      --success: #3fae6a;
      --success-ink: #08170f;
      --warn: #e0a458;
      --warn-bg: rgba(224, 164, 88, 0.14);
      --warn-border: rgba(224, 164, 88, 0.40);
      --warn-icon-bg: rgba(224, 164, 88, 0.24);
      --danger: #dd6259;
      --danger-ink: #200604;
      --muted: #9b9691;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f2f0ed;
    --paper: #0e0e10;
    --panel: #1a1a1d;
    --panel-2: #222225;
    --line: #2b2a2c;
    --accent: #d1592f;
    --accent-ink: #fff7f2;
    --success: #3fae6a;
    --success-ink: #08170f;
    --warn: #e0a458;
    --warn-bg: rgba(224, 164, 88, 0.14);
    --warn-border: rgba(224, 164, 88, 0.40);
    --warn-icon-bg: rgba(224, 164, 88, 0.24);
    --danger: #dd6259;
    --danger-ink: #200604;
    --muted: #9b9691;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  header {
    position: sticky;
    top: 0;
    padding: calc(var(--safe-top) + 14px) 16px 14px;
    margin-top: calc(-1 * var(--safe-top));
    background: var(--panel);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 10;
  }
  header .brand-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .logo-mark {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
  }
  header .brand-text { min-width: 0; }
  header .brand { font-weight: 700; letter-spacing: 0.2px; font-size: 1.02rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tagline { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .header-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  header .icon-btn {
    background: none; border: none; color: var(--ink);
    font-size: 1.1rem; position: relative; padding: 6px 8px; line-height: 1;
    border-radius: 8px;
  }
  header .who { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  main { padding: 16px; padding-bottom: 96px; max-width: 720px; margin: 0 auto; }
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-bottom);
    z-index: 10;
    overflow-x: auto;
  }
  nav.tabs button {
    flex: 1 0 auto;
    min-width: 62px;
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 4px 12px;
    font-size: 0.72rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  nav.tabs button .icon { font-size: 1.25rem; }
  nav.tabs button.active { color: var(--accent); font-weight: 600; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 16px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 1rem;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 600;
    margin-top: 14px;
  }
  button.primary:disabled { opacity: 0.5; }
  button.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  .article-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .article-row:last-child { border-bottom: none; }
  .article-row .name { font-weight: 600; font-size: 0.92rem; }
  .article-row .code { font-size: 0.78rem; color: var(--muted); }
  .stock-pill {
    font-size: 0.78rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .stock-pill.low { color: var(--danger); border-color: var(--danger); }
  .line-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .line-item .line-name { flex: 1; font-size: 0.9rem; }
  .line-item input[type=number] { width: 84px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
  .success { color: var(--success); font-size: 0.9rem; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .segmented { display: flex; gap: 6px; margin-top: 4px; }
  .segmented button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.82rem;
  }
  .segmented button.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .accordion-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .commande-row.expanded { background: var(--paper); }
  #install-banner {
    display: none;
    position: fixed;
    left: 0; right: 0; top: var(--safe-top);
    z-index: 20;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 10px 14px;
    font-size: 0.82rem;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #install-banner.show { display: flex; }
  #install-banner button {
    background: rgba(0,0,0,0.15);
    border: none;
    color: inherit;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  #install-banner .close { background: none; padding: 6px; }

  #toast {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    padding-top: calc(var(--safe-top) + 10px);
    pointer-events: none;
  }
  #toast .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    transform: translateY(-140%);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    max-width: 90vw;
    text-align: center;
  }
  #toast .bubble.error { background: var(--danger); color: #fff; }
  #toast.show .bubble { transform: translateY(0); }

  /* ---- Accueil (home) ---- */
  .badge-dot {
    position: absolute; top: -1px; right: 2px;
    background: var(--danger); color: var(--danger-ink);
    border-radius: 999px; font-size: 0.62rem; font-weight: 700;
    padding: 1px 5px; line-height: 1.25; min-width: 15px; text-align: center;
  }
  .greeting-card { margin-bottom: 16px; }
  .greeting-hello { font-size: 1.35rem; font-weight: 700; margin: 2px 0 2px; }
  .greeting-role { color: var(--muted); font-size: 0.88rem; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 20px 0 10px;
  }
  .section-head h2 { margin: 0; font-size: 1.02rem; }
  .section-head a { color: var(--accent); font-size: 0.82rem; text-decoration: none; font-weight: 600; }

  .pending-card {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
  }
  .pending-card .pending-head { display: flex; align-items: center; gap: 12px; }
  .pending-card .pending-icon {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    background: var(--warn-icon-bg);
    color: var(--warn);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .pending-card .pending-title { font-weight: 700; font-size: 0.95rem; }
  .pending-card .pending-sub { font-size: 0.78rem; color: var(--muted); }
  .pending-card .chevron { margin-left: auto; color: var(--muted); font-size: 1.1rem; }
  .pending-card .pending-line {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 9px 0 0; margin-top: 9px;
    border-top: 1px solid var(--warn-border);
    font-size: 0.85rem;
  }
  .pending-card .pending-line .pl-ref { font-weight: 600; }
  .pending-card .pending-line .pl-when { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick-tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
    color: var(--ink);
  }
  .quick-tile .qt-icon { font-size: 1.5rem; }
  .quick-tile .qt-label { font-size: 0.8rem; font-weight: 700; line-height: 1.2; }
  .quick-tile .qt-sub { font-size: 0.68rem; color: var(--muted); line-height: 1.2; }
  .quick-tile.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .quick-tile.primary .qt-sub { color: var(--accent-ink); opacity: 0.75; }

  .movement-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .movement-row:last-child { border-bottom: none; }
  .movement-row .mv-icon {
    width: 38px; height: 38px; flex: none; border-radius: 10px;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .movement-row .mv-name { font-weight: 700; font-size: 0.88rem; }
  .movement-row .mv-sub { font-size: 0.76rem; color: var(--muted); }
  .movement-row .mv-when { font-size: 0.76rem; color: var(--muted); white-space: nowrap; margin-left: auto; text-align: right; }

  .status-pill {
    font-size: 0.72rem; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .status-pill.approved { background: var(--success); color: var(--success-ink); }
  .status-pill.pending { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
  .status-pill.rejected { background: var(--danger); color: var(--danger-ink); }

  /* ---- Loading screen (startup splash) ------------------------------- */
  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #f7f5f2;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .loading-logo {
    width: 132px; height: auto; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(58,26,18,0.18));
    margin-bottom: 22px;
    animation: loading-pop 0.6s ease both;
  }
  .loading-title {
    color: #3a1a12; font-weight: 800; font-size: 1.5rem; letter-spacing: 0.08em;
    animation: loading-fade-up 0.6s ease 0.1s both;
  }
  .loading-subtitle {
    color: #d98a5e; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.04em;
    margin-top: 4px;
    animation: loading-fade-up 0.6s ease 0.2s both;
  }
  .loading-spinner {
    display: flex; gap: 6px; margin-top: 28px;
    animation: loading-fade-up 0.6s ease 0.3s both;
  }
  .loading-spinner span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c45a2a;
    animation: loading-bounce 1s ease-in-out infinite;
  }
  .loading-spinner span:nth-child(2) { animation-delay: 0.15s; }
  .loading-spinner span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes loading-pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes loading-fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes loading-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-8px); opacity: 1; }
  }

  /* Magasin / Production menus + production report screens */
  .big-menu { display: grid; gap: 12px; }
  .big-btn {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 22px 18px; text-align: left;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    font: inherit; cursor: pointer;
  }
  .big-btn:active { background: var(--panel-2); }
  .big-btn .bb-icon { font-size: 2.2rem; line-height: 1; }
  .big-btn .bb-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .big-btn .bb-label { font-weight: 700; font-size: 1.15rem; }
  .big-btn .bb-sub { font-size: 0.8rem; color: var(--muted); }
  .big-btn .bb-arrow { font-size: 1.6rem; color: var(--muted); }
  #backbar { max-width: 720px; margin: 0 auto; padding: 10px 16px 0; }
  #backbar:empty { display: none; }
  .back-btn { padding: 7px 14px; font-size: 0.9rem; }
  .prod-block > summary { cursor: pointer; font-weight: 600; font-size: 0.98rem; }
  .line-item input.pf { width: 96px; text-align: right; }
  .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .hours-grid.two { grid-template-columns: repeat(2, 1fr); }
  .hours-grid.three { grid-template-columns: repeat(3, 1fr); }
  .hours-grid input.pf, .hours-grid select { width: 100%; padding: 9px 6px; font-size: 0.92rem; text-align: left; }
  .hours-grid > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-inner">
    <img src="assets/logo-splash.png" alt="Ideal Brique" class="loading-logo" />
    <div class="loading-title">IDEAL BRIQUE</div>
    <div class="loading-subtitle">Gestion de Stock</div>
    <div class="loading-spinner"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="install-banner">
  <span id="install-banner-text"></span>
  <span style="display:flex;gap:6px">
    <button id="install-banner-action"></button>
    <button class="close" id="install-banner-close">✕</button>
  </span>
</div>
<div id="toast"><div class="bubble"></div></div>
<div id="app"></div>

<!--
  Loaded locally (not via node_modules import, which can't resolve in a
  plain WebView with no bundler). Order matters: capacitor.js builds the
  full Capacitor object on top of what the native Android bridge already
  injected, and push-notifications.js needs that in place before it can
  register itself as window.Capacitor.Plugins.PushNotifications. Both are
  harmless no-ops outside the native app (e.g. testing in a browser).
-->
<script src="vendor/capacitor.js"></script>
<script src="vendor/push-notifications.js"></script>

<script>
(function () {
  // ---- Config -------------------------------------------------------
  // Point this at wherever you deploy the backend/ connector service.
  // Also editable in-app from the login screen (⚙ Adresse du serveur) —
  // useful on a real device where there's no browser console to set it from.
  // Only the two known server addresses are ever used (see below). Anything else
  // stored by an older version of the app (temporary tunnel addresses...) is ignored.
  function getApiBase() {
    let v = null;
    try { v = window.localStorage.getItem('gmao_api_base'); } catch (e) { /* ignore */ }
    return v === LAN_BASE || v === PUBLIC_BASE ? v : PUBLIC_BASE;
  }
  function setApiBase(url) {
    try { window.localStorage.setItem('gmao_api_base', url); } catch (e) { /* ignore */ }
  }

  // ---- Server address ---------------------------------------------------
  // Two fixed addresses, chosen automatically (nothing to type):
  //   1. PUBLIC: the permanent Cloudflare tunnel, works from anywhere with internet
  //   2. LAN: the server on the office network, works on the office Wi-Fi even when
  //      the internet is down
  // The app uses the one that answers (the office address first, it is faster).
  const LAN_BASE = 'http://192.168.1.188:4000/api';
  const PUBLIC_BASE = 'https://gmao.ibb.sarl/api';

  async function probeServer(base, ms) {
    if (!base) return false;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(base.replace(/\/+$/, '') + '/health', { signal: ctrl.signal, cache: 'no-store' });
      const j = await res.json().catch(() => null);
      return res.ok && !!j && j.status === 'ok';
    } catch (e) { return false; }
    finally { clearTimeout(timer); }
  }

  // Returns a reachable base address, or null when none answers.
  async function findServer() {
    if (await probeServer(LAN_BASE, 1500)) return LAN_BASE;
    if (await probeServer(PUBLIC_BASE, 6000)) return PUBLIC_BASE;
    return null;
  }

  // One search at a time, and not more often than every 15 s when nothing is found.
  let findInflight = null;
  let findFailedAt = 0;
  function rediscoverServer() {
    if (findInflight) return findInflight;
    if (Date.now() - findFailedAt < 15000) return Promise.resolve(null);
    findInflight = findServer().then((base) => {
      if (base) {
        findFailedAt = 0;
        if (base !== getApiBase()) { setApiBase(base); window.dispatchEvent(new Event('gmao-server-changed')); }
      } else findFailedAt = Date.now();
      return base;
    }).finally(() => { findInflight = null; });
    return findInflight;
  }

  // Must match backend/src/roles.js exactly - only used here to decide
  // which tabs to show; the backend is the real enforcement point.
  const ADMIN_ROLES = ['Administrateur'];
  const MANAGER_ROLES = ['Administrateur', 'Responsable Méthode', 'Responsable Magasin', 'Magasinier'];
  const isManager = () => state.user && MANAGER_ROLES.includes(state.user.fonction);
  // Per-feature rights come from the server (role default + exceptions set by an administrator).
  const can = (k) => !!(state.perms && state.perms[k]);
  // Same rule as the desktop and the server: everyone but the Administrateur
  // role can create a demande d'achat (the server enforces it too).
  const canCreateDa = () => can('da.create');
  const isAdmin = () => can('users.admin');

  // ---- Tiny state / storage helpers ----------------------------------
  const state = {
    token: null,
    user: null,
    tab: 'accueil',
    theme: null,
    articles: [],
    search: '',
    selectedArticle: null,
    bsmLines: [],
    daLines: [],
    sub: { bsm: 'new', brm: 'new', da: 'review', atelier: 'open', parc: 'conso', maintenance: 'di', achats: 'synth', analyse: 'min' },
    parc: null,
    prod: null,
    daOptions: null,
    receptionCommande: null,
    receptionLines: [],
    error: '',
    notice: ''
  };

  function loadSession() {
    try {
      const raw = localStorage.getItem('gmao_session');
      if (raw) {
        const s = JSON.parse(raw);
        state.token = s.token;
        state.user = s.user;
        state.perms = s.perms || null;
      }

  // ---- Theme (dark/light) ----------------------------------------------

  // already follows the OS setting on its own.
  function loadTheme() {
    try {
      state.theme = localStorage.getItem('gmao_theme') || null;
    } catch (e) { state.theme = null; }
    applyTheme();
  }
  function applyTheme() {
    if (state.theme === 'dark' || state.theme === 'light') {

    } else {
      document.documentElement.removeAttribute('data-theme');
    }

  function toggleTheme() {

      ? state.theme === 'dark'

  // ---- Data usage -----------------------------------------------------
  // Everything the app downloads goes through api(). To keep mobile data
  // use low it:
  //  - keeps short-lived copies of read-only answers in memory (the same
  //    list opened twice within a minute is not downloaded twice),
  //  - clears them as soon as anything is written (so nothing looks stale),
  //  - shares one request between identical simultaneous calls,
  //  - gives up after 25 s instead of hanging on a bad network.
  // Automatic refreshes (bell badge, Accueil lists) are skipped on mobile
  // data when "Économie de données" is on (see skipBackground()).
  const apiCache = new Map();   // key -> { at, data }
  const apiInflight = new Map();
  const CACHE_RULES = [
    [/^\/reference-data\//, 600000],
    [/^\/da\/options/, 600000],
    [/^\/notifications\/unread-count/, 60000],
    [/^\/(movements\/mine|bsm\/pending|brm\/pending)/, 60000],
    [/^\/articles\?/, 30000],
    [/^\/atelier\/of\?/, 30000],
    [/^\/maintenance\/(options|equipements)/, 600000]
  ];
  function cacheTtl(path) {
    const r = CACHE_RULES.find(([re]) => re.test(path));
    return r ? r[1] : 0;
  }
  function clearApiCache() { apiCache.clear(); apiInflight.clear(); }

  function dataSaverOn() {
    try { return localStorage.getItem('gmao_data_saver') !== '0'; } catch (e) { return true; }
  }
  function onMeteredNetwork() {
    const c = navigator.connection;      // Android WebView: type is 'wifi' | 'cellular' | ...
    return !!c && (c.type === 'cellular' || c.saveData === true);
  }
  // True when automatic (not user-triggered) downloads should wait.
  function skipBackground() { return dataSaverOn() && onMeteredNetwork(); }

  async function networkFetchRaw(path, options) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort('timeout'), 25000);
    let usedBase = getApiBase();   // the address THIS request was sent to
    if (options.signal) options.signal.addEventListener('abort', () => ctrl.abort('cancelled'));
    try {
      usedBase = getApiBase();
      const res = await fetch(usedBase + path, {
        ...options,
        signal: ctrl.signal,
        headers: {
          'Content-Type': 'application/json',
          ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
          ...(options.headers || {})
        },
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      let isJson = true;
      const data = await res.json().catch(() => { isJson = false; return {}; });
      // A stopped tunnel / proxy answers with an HTML error page, not with our JSON.
      if (!res.ok && !isJson && [502, 503, 504, 521, 522, 523, 524, 530].includes(res.status)) {
        const gone = new TypeError('server gone');
        gone.serverGone = true;
        throw gone;
      }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    } catch (e) {
      if (e.name === 'AbortError' || ctrl.signal.aborted) {
        const cancelled = ctrl.signal.reason === 'cancelled';
        const isGet = !options.method || options.method.toUpperCase() === 'GET';
        if (!cancelled && !options._retried && isGet) {
          const found = await rediscoverServer();
          if (found && found !== usedBase) return networkFetchRaw(path, { ...options, _retried: true });
        }
        const err = new Error(cancelled ? 'cancelled' : 'Réseau trop lent ou serveur injoignable.');
        err.cancelled = cancelled; err.network = !cancelled;
        throw err;
      }
      // Server not reachable: look for its (possibly new) address and retry once.
      // A request that never reached our server (connection error, tunnel error
      // page) is safe to resend. After a timeout only reads are resent (above),
      // to avoid doing a write twice.
      if (!options._retried && e instanceof TypeError) {
        const found = await rediscoverServer();
        if (found && found !== usedBase) return networkFetchRaw(path, { ...options, _retried: true });
      }
      if (e instanceof TypeError) { const err = new Error('Serveur injoignable. Vérifiez la connexion et l\'adresse du serveur.'); err.network = true; throw err; }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function api(path, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    if (method !== 'GET') {
      try { return await networkFetch(path, options); }
      finally { clearApiCache(); }          // anything may have changed
    }
    const ttl = options.fresh ? 0 : cacheTtl(path);
    const key = (state.user ? state.user.id : '') + '|' + path;
    if (ttl > 0) {
      const hit = apiCache.get(key);
      if (hit && Date.now() - hit.at < ttl) return hit.data;
    }
    const run = async () => {
      let data;
      try { data = await networkFetch(path, options); }
      catch (e) {
        const old = e.network && offlineRead(key, path);
        if (!old) throw e;
        return old;                      // offline: show what the phone last saw (banner says so)
      }
      if (cacheTtl(path) > 0) apiCache.set(key, { at: Date.now(), data });
      offlineSave(key, path, data);
      return data;
    };
    if (options.signal) return run();       // cancellable calls are not shared
    if (apiInflight.has(key)) return apiInflight.get(key);
    const p = run().finally(() => apiInflight.delete(key));
    apiInflight.set(key, p);
    return p;
  }

  // ---- Offline: last-seen lists + queue of writes ---------------------------------
  // 1. Reads: answers of the main lists are kept on the phone. When the server cannot
  //    be reached the last copy is shown and a bar says so.
  // 2. Writes: a new BSM or DI created without network is kept in a queue on the phone and
  //    sent automatically when the server answers again. Every queued request carries a
  //    unique client_ref so the server never creates the same document twice.
  //    Business refusals (e.g. not enough stock by then) are shown in the queue, not retried.
  const OFFLINE_READ = [/^\/maintenance\/(di|ot|agenda|options|equipements)/, /^\/da\/options/, /^\/reference-data\//, /^\/bsm\/pending/,
    /^\/brm\/pending/, /^\/movements\/mine/, /^\/stock-insight\//, /^\/da-review/, /^\/carburant\/(engins|alertes)/, /^\/da\/mine/];
  const OFF_KEY = 'gmao_off_v1', Q_KEY = 'gmao_queue_v1';
  const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  function offlineSave(key, path, data) {
    if (!OFFLINE_READ.some((r) => r.test(path))) return;
    const txt = JSON.stringify(data); if (txt.length > 150000) return;
    const all = lsGet(OFF_KEY, {}); all[key] = { at: Date.now(), data };
    const keys = Object.keys(all).sort((a, b) => all[b].at - all[a].at);
    keys.slice(40).forEach((k) => delete all[k]);
    if (!lsSet(OFF_KEY, all)) { keys.slice(10).forEach((k) => delete all[k]); lsSet(OFF_KEY, all); }
  }
  function offlineRead(key, path) {
    if (!OFFLINE_READ.some((r) => r.test(path))) return null;
    const hit = lsGet(OFF_KEY, {})[key]; if (!hit) return null;
    state.staleAt = hit.at; updateNetBar();
    return hit.data;
  }
  function netUp() { if (state.offline || state.staleAt) { state.offline = false; state.staleAt = null; updateNetBar(); } if (queueFor().length) syncQueue(); }
  function netDown() { if (!state.offline) { state.offline = true; updateNetBar(); } }
  async function networkFetch(path, options) {
    try { const d = await networkFetchRaw(path, options); netUp(); return d; }
    catch (e) { if (e.network) netDown(); throw e; }
  }

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
  const queueAll = () => lsGet(Q_KEY, []);
  const queueFor = () => queueAll().filter((x) => state.user && x.user === state.user.id);
  const queueSave = (q) => lsSet(Q_KEY, q);
  function enqueue(item) {
    const q = queueAll(); q.push({ id: uuid(), user: state.user.id, at: Date.now(), ...item });
    if (JSON.stringify(q).length > 1500000 || !queueSave(q)) return false;
    updateNetBar(); return true;
  }
  const blobToDataUrl = (b) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(b); });
  const dataUrlToBlob = (u) => { const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: (/:(.*?);/.exec(h) || [])[1] || 'image/jpeg' }); };
  // Sends now; if the server cannot be reached the request is kept and sent later.
  // Returns { out } when sent, { queued: true } when kept. Other errors are thrown.
  async function postOrQueue({ path, body, label, kind, photos }) {
    const withRef = { ...body, client_ref: uuid() };
    try { return { out: await api(path, { method: 'POST', body: withRef }) }; }
    catch (e) {
      if (!e.network) throw e;
      const urls = []; for (const b of photos || []) urls.push(await blobToDataUrl(b));
      if (!enqueue({ path, body: withRef, label, kind, photos: urls })) throw new Error('Hors ligne et trop volumineux pour être gardé sur le téléphone. Réessayez avec le réseau.');
      showToast('📴 Pas de réseau : enregistré sur le téléphone, envoi automatique au retour du réseau');
      return { queued: true };
    }
  }
  let syncing = false;
  async function syncQueue() {
    if (syncing || !state.token || !state.user) return;
    syncing = true;
    try {
      for (const it of queueFor().filter((x) => !x.error)) {
        try {
          const out = await api(it.path, { method: 'POST', body: it.body });
          if (it.kind === 'di' && out.id) for (const p of it.photos || []) { try { await uploadDiPhoto(out.id, dataUrlToBlob(p)); } catch (e) { /* photo lost, DI is created */ } }
          queueSave(queueAll().filter((x) => x.id !== it.id));
          showToast(`✓ ${it.label} envoyé`);
        } catch (e) {
          if (e.network || /expired|Missing token/i.test(e.message)) break;          // try again later / after login
          queueSave(queueAll().map((x) => (x.id === it.id ? { ...x, error: e.message } : x)));
        }
      }
    } finally { syncing = false; updateNetBar(); }
  }
  function updateNetBar() {
    let bar = document.getElementById('net-bar');
    const q = queueFor(), pending = q.filter((x) => !x.error).length, failed = q.length - pending;
    const msg = [];
    if (state.offline) msg.push('📴 Serveur injoignable' + (state.staleAt ? ` · données du ${new Date(state.staleAt).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : ''));
    if (pending) msg.push(`⏳ ${pending} envoi(s) en attente`);
    if (failed) msg.push(`⚠ ${failed} refusé(s)`);
    if (!msg.length || !state.token) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'net-bar';
      bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(68px + var(--safe-bottom));z-index:30;background:#3b3b3b;color:#fff;border-radius:10px;padding:8px 12px;font-size:0.85rem;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)';
      bar.onclick = () => { if (queueFor().length) openQueueSheet(); else checkServerNow(); };
      document.body.appendChild(bar);

  }
  async function checkServerNow() { try { await api('/permissions/me', { fresh: true }); showToast('Serveur joignable'); } catch (e) { showToast(e.message, true); } }
  function openQueueSheet() {
    const { sheet, close } = openSheet('<div></div>');
    const draw = () => {
      const q = queueFor();
      sheet.innerHTML = `<h2 style="margin-top:0">Envois en attente</h2>` + (q.map((x) => `<div class="line-item" style="align-items:flex-start"><div class="line-name">${escapeHtml(x.label)}<br><span class="muted">${new Date(x.at).toLocaleString('fr-FR')}</span>${x.error ? `<br><span class="error">${escapeHtml(x.error)}</span>` : ''}</div><button class="ghost" data-del="${x.id}" style="padding:4px 10px">${x.error ? 'Supprimer' : 'Annuler'}</button></div>`).join('') || '<div class="empty">Rien en attente</div>')
        + '<button class="primary" id="q-retry" style="width:100%;margin-top:12px">Envoyer maintenant</button><button class="ghost" id="q-close" style="width:100%;margin-top:8px">Fermer</button>';
      sheet.querySelectorAll('[data-del]').forEach((b) => { b.onclick = () => { if (!confirm('Supprimer cet envoi du téléphone ?')) return; queueSave(queueAll().filter((x) => x.id !== b.dataset.del)); updateNetBar(); draw(); }; });
      sheet.querySelector('#q-close').onclick = close;
      sheet.querySelector('#q-retry').onclick = async () => { queueSave(queueAll().map((x) => (x.user === state.user.id ? { ...x, error: undefined } : x))); await syncQueue(); draw(); };
    };

  }

  setInterval(() => { if (!document.hidden && state.token && queueFor().some((x) => !x.error)) syncQueue(); }, 45000);

  // ---- Rendering -------------------------------------------------------
  const app = document.getElementById('app');

  function render() {

    const tabs = [

      MAG.some(can) ? tabButton('magasin', '🏬', 'Magasin') : '',
      can('production.view') ? tabButton('production', '📝', 'Production') : '',
      can('maintenance.view') || can('di.create') ? tabButton('maintenance', '🔧', 'Maintenance') : '',
      can('atelier.view') ? tabButton('atelier', '🏭', 'Atelier') : '',
      can('parc.view') ? tabButton('parc', '🚜', 'Parc') : ''
    ].filter(Boolean);

    app.innerHTML = `
      <header>

            🔔<span id="bell-badge" class="badge-dot" style="display:none"></span>

  function tabButton(id, icon, label) {

  // Screens reached from a menu: view -> the bottom-nav entry that owns it.

  // ---- Maintenance: DI (create + follow), OT (follow), agenda -----------------
  const MONEY_ROLES = ['Administrateur', 'Responsable Méthode', 'Responsable Magasin', 'Responsable Achat', 'DGA'];

  const mPeriod = (key, days) => {

  function periodCard(key, onChange, maxToday = true) {

      <label style="flex:1" class="muted">Du<input type="date" class="pf" value="${P.from}" ${maxToday ? `max="${isoDate()}"` : ''} /></label>

    const upd = () => { if (f.value && t.value && f.value <= t.value) { state.mp[key] = { from: f.value, to: t.value }; reload(); } };

  }

  // Photo: shrink to 1280 px JPEG before upload (saves mobile data, server caps at 1.5 MB).
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('Photo illisible'))), 'image/jpeg', 0.7);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Photo illisible')); };
      img.src = url;
    });
  }
  async function uploadDiPhoto(idDi, blob) {
    const res = await fetch(getApiBase() + `/maintenance/di/${idDi}/photos`, { method: 'POST', headers: { 'Content-Type': 'image/jpeg', Authorization: 'Bearer ' + state.token }, body: blob });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Envoi de la photo impossible');
  }

        <div id="f-msg"></div>
      </div>`;
    const sel = (k) => root.querySelector('#f-' + k);
    const fillLevel = async (i, parent) => {
      const [k] = levels[i]; const el = sel(k);
      const rows = await api(`/maintenance/equipements?parent=${parent}`);
      el.innerHTML = '<option value="">—</option>' + rows.map((r) => `<option value="${r.id}">${escapeHtml(r.designation)}</option>`).join('');
      el.disabled = rows.length === 0 && i > 0;
      for (let j = i + 1; j < levels.length; j++) { const e2 = sel(levels[j][0]); e2.innerHTML = '<option value="">—</option>'; e2.disabled = true; }
    };
    levels.forEach(([k], i) => { sel(k).onchange = async () => { if (i < levels.length - 1) { const v = sel(k).value; if (v) { try { await fillLevel(i + 1, v); sel(levels[i + 1][0]).disabled = false; } catch (e) { /* shown on send */ } } else for (let j = i + 1; j < levels.length; j++) { sel(levels[j][0]).innerHTML = '<option value="">—</option>'; sel(levels[j][0]).disabled = true; } } }; });
    (async () => {   // rebuild the equipment branch (also after a photo re-render)
      try {
        await fillLevel(0, 0);
        for (let i = 0; i < levels.length - 1; i++) {
          const v = f.chain && f.chain[i]; if (!v) break;

    root.querySelectorAll('#f-urg button').forEach((b) => { b.onclick = () => { f.urgence = b.dataset.u; root.querySelectorAll('#f-urg button').forEach((x) => x.classList.toggle('selected', x === b)); }; });

    const ph = root.querySelector('#f-photo');
    if (ph) ph.onchange = async () => { if (!ph.files[0]) return; keep(); try { const blob = await shrinkPhoto(ph.files[0]); f.photos.push({ blob, url: URL.createObjectURL(blob) }); renderMaintNew(root); } catch (e) { root.querySelector('#f-msg').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; } };
    root.querySelector('#f-send').onclick = async (ev) => {
      keep(); const msg = root.querySelector('#f-msg'); msg.innerHTML = '';
      const btn = ev.currentTarget; btn.disabled = true;
      try {
        const sent = await postOrQueue({ path: '/maintenance/di', kind: 'di', label: 'Demande d\'intervention', photos: f.photos.map((p) => p.blob), body: {
          id_demandeur: Number(f.dem) || null, id_defaillance: Number(f.ano) || null, urgence: f.urgence, description: f.desc, arret_machine: f.arret,
          atelier: Number(sel('atelier').value) || null, equipement: Number(sel('equipement').value) || null,
          sous_equipement: Number(sel('sous_equipement').value) || null, organe: Number(sel('organe').value) || null } });
        const out = sent.out || {};
        let failed = 0;
        if (!sent.queued) for (const p of f.photos) { try { await uploadDiPhoto(out.id, p.blob); } catch (e) { failed++; } }
        f.photos.forEach((p) => URL.revokeObjectURL(p.url));
        state.diForm = null;
        if (!sent.queued) showToast(`DI ${out.n_di || ''} créée${failed ? ` (${failed} photo(s) non envoyée(s))` : ''}`);

      } catch (e) { btn.disabled = false; msg.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; }
    };
  }

  // Share the displayed synthesis as a PNG (WhatsApp, mail...): drawn on a canvas, no library.
  async function shareTablePng(title, head, rows, foot) {
    const cols = head.length, W = 760, pad = 24, rh = 34, colW = [W - pad * 2 - (cols - 1) * 140, ...Array(cols - 1).fill(140)];
    const H = pad * 2 + 56 + rh * (rows.length + 1 + foot.length) + 10;
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2; const g = c.getContext('2d'); g.scale(2, 2);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#111'; g.textBaseline = 'middle';
    g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.fillText(title, W / 2, pad + 14);
    let y = pad + 56;
    const row = (cells, bold, fill) => {
      let x = pad; if (fill) { g.fillStyle = fill; g.fillRect(pad, y, W - pad * 2, rh); g.fillStyle = '#111'; }
      g.font = (bold ? 'bold ' : '') + '16px sans-serif';
      cells.forEach((t, i) => { g.strokeStyle = '#999'; g.strokeRect(x, y, colW[i], rh); g.textAlign = i === 0 ? 'left' : 'right';
        g.fillText(String(t ?? ''), i === 0 ? x + 8 : x + colW[i] - 8, y + rh / 2, colW[i] - 16); x += colW[i]; });
      y += rh;
    };
    row(head, true, '#e8e8e8'); rows.forEach((r) => row(r, false)); foot.forEach((r) => row(r, true, '#f3f3f3'));
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
    const file = new File([blob], title.replace(/[^\w]+/g, '_') + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return; }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); showToast('Image enregistrée dans les téléchargements');
  }

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "À l'instant";
    if (mins < 60) return `Il y a ${mins} min`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `Il y a ${hours} h`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `Il y a ${days} j`;
    return new Date(dateStr).toLocaleDateString('fr-FR');
  }

  // QR code: the phone's camera app takes a photo (no camera permission needed
  // in the app), the code is decoded in the page with jsQR.
  // Accepted contents: an article code / reference, "gmao:article:<code>" or "gmao:engin:<id>".
  function loadScript(src) {
    return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Lecteur QR indisponible.')); document.head.appendChild(s); });
  }
  async function decodeQrFromFile(file) {
    if (!window.jsQR) await loadScript('vendor/jsQR.js');
    const bmp = await createImageBitmap(file);
    // try a few sizes: large photos can fail to decode at full resolution
    for (const max of [1280, 800, 2000]) {
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0, w, h);
      const r = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) return r.data;
    }
    return null;
  }
  function scanQrPhoto(onText) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try {
        showToast('Lecture du QR code…');
        const text = await decodeQrFromFile(f);
        if (!text) { showToast('Aucun QR code lisible sur la photo. Rapprochez-vous et réessayez.', true); return; }
        await onText(text);
      } catch (e) { showToast(e.message || 'Lecture impossible.', true); }
    };
    inp.click();
  }

    wireArticlePicker('da-search', 'da-suggestions', addDaLine);
    renderDaLines();
    document.getElementById('submit-da').onclick = submitDa;
  }

  // ---- DA review (approvers): confirm / refuse / send to admin / postpone -------------
  const DA_TABS = [[0, 'En cours'], [3, "Chez l'admin"], [4, 'Reportées']];
  async function renderDaReview(root) {
    state.daRev = state.daRev || { statut: 0 };
    root.innerHTML = '<div class="card" style="padding:10px"><div class="segmented" id="dr-tabs" style="margin-top:0"></div></div><div class="card" id="dr-body"><div class="empty">Chargement…</div></div>';
    const box = root.querySelector('#dr-body'), tabs = root.querySelector('#dr-tabs');

        const d = await api(`/da-review?statut=${state.daRev.statut}`, { fresh: true });

        tabs.querySelectorAll('button').forEach((b) => { b.onclick = () => { state.daRev.statut = Number(b.dataset.k); box.innerHTML = '<div class="empty">Chargement…</div>'; load(); }; });
        if (!d.da.length) { box.innerHTML = '<div class="empty">Aucune demande</div>'; return; }
        box.innerHTML = d.da.map((x) => `<div class="article-row" data-da="${x.id}" style="cursor:pointer;align-items:flex-start"><div style="min-width:0"><div class="name">DA #${x.id} · ${escapeHtml(x.demandeur || x.createur || '')}</div><div class="code">${frDate(x.date)} ${escapeHtml(x.heure || '')} · ${x.nb_lignes} article(s) · délai ${x.delai} ${escapeHtml((x.periode || '').toLowerCase())}</div></div>${pill(x.statut_label, false)}</div>`).join('');
        box.querySelectorAll('[data-da]').forEach((r) => { r.onclick = () => openDaSheet(Number(r.dataset.da), load); });
      } catch (e) { box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; }
    };
    load();
  }
  async function openDaSheet(id, onChange) {
    const { sheet, close } = openSheet('<div class="empty">Chargement…</div>');
    let d;
    try { d = await api(`/da-review/${id}`, { fresh: true }); }
    catch (e) { sheet.innerHTML = `<div class="error">${escapeHtml(e.message)}</div><button class="ghost" id="da-close" style="width:100%">Fermer</button>`; sheet.querySelector('#da-close').onclick = close; return; }
    const A = d.actions;
    sheet.innerHTML = `
      <h2 style="margin-top:0">DA #${d.id}</h2>
      <div style="margin-bottom:6px">${pill(d.statut_label, false)}</div>
      <div class="muted">${frDate(d.date)} ${escapeHtml(d.heure || '')} · demandeur ${escapeHtml(d.demandeur || '—')} · saisi par ${escapeHtml(d.createur || '—')} · délai ${d.delai} ${escapeHtml((d.periode || '').toLowerCase())}</div>
      ${d.cause ? `<div class="error">Refus : ${escapeHtml(d.cause)}</div>` : ''}
      <div style="margin-top:10px">${d.lines.map((l) => `<div class="line-item" style="align-items:flex-start"><div class="line-name">${escapeHtml(l.designation)}<br><span class="muted">${escapeHtml(l.code)} · stock ${fmtQty(l.stock)}${l.motif ? ' · ' + escapeHtml(l.motif) : ''}${l.equipements.length ? '<br>🔧 ' + escapeHtml(l.equipements.join(', ')) : ''}</span></div><strong>× ${fmtQty(l.qt)}</strong></div>`).join('')}</div>
      <div id="da-form"></div><div id="da-msg"></div>
      ${A.includes('confirmer') ? '<button class="primary" id="da-ok" style="width:100%;margin-top:12px">✅ Confirmer</button>' : ''}
      ${A.includes('refuser') ? '<button class="ghost" id="da-no" style="width:100%;margin-top:8px">⛔ Refuser…</button>' : ''}
      ${A.includes('admin') ? '<button class="ghost" id="da-adm" style="width:100%;margin-top:8px">➡️ Envoyer à l\'administrateur</button>' : ''}
      ${A.includes('reporter') ? '<button class="ghost" id="da-rep" style="width:100%;margin-top:8px">🗓 Reporter…</button>' : ''}
      ${A.includes('retourner') ? '<button class="ghost" id="da-back" style="width:100%;margin-top:8px">↩️ Remettre en cours</button>' : ''}
      <button class="ghost" id="da-close" style="width:100%;margin-top:8px">Fermer</button>`;
    sheet.querySelector('#da-close').onclick = close;
    const msg = sheet.querySelector('#da-msg'), form = sheet.querySelector('#da-form');
    const send = async (action, body, ask) => {
      if (ask && !confirm(ask)) return;
      sheet.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      try { await api(`/da-review/${id}/${action}`, { method: 'POST', body: body || {} }); showToast('Demande mise à jour'); close(); onChange && onChange(); }
      catch (e) { sheet.querySelectorAll('button').forEach((b) => { b.disabled = false; }); msg.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; }
    };
    const on = (sel, fn) => { const b = sheet.querySelector(sel); if (b) b.onclick = fn; };
    on('#da-ok', () => send('confirmer', {}, `Confirmer la demande d'achat #${id} ?`));
    on('#da-adm', () => send('admin', {}, `Envoyer la DA #${id} à l'administrateur ?`));
    on('#da-back', () => send('retourner', {}, `Remettre la DA #${id} en cours ?`));
    on('#da-no', () => { form.innerHTML = '<label>Cause du refus</label><textarea id="da-cause" rows="3" maxlength="250"></textarea><button class="primary" id="da-no-go" style="width:100%;margin-top:8px">Confirmer le refus</button>'; form.querySelector('#da-no-go').onclick = () => send('refuser', { cause: form.querySelector('#da-cause').value }); });
    on('#da-rep', () => { form.innerHTML = `<label>Nouvelle date</label><input type="date" id="da-date" min="${isoDate()}" value="${isoDate()}"><button class="primary" id="da-rep-go" style="width:100%;margin-top:8px">Confirmer le report</button>`; form.querySelector('#da-rep-go').onclick = () => send('reporter', { date: form.querySelector('#da-date').value }); });
  }

  function renderDaMine(root) {
    root.innerHTML = `

        <div id="da-mine"><div class="empty">Chargement…</div></div>

  async function addDaLine(art) {
    if (state.daLines.some((l) => l.id === art.id)) return;
    const line = { id: art.id, name: art.name, qty: 1, motif: '', requires_equipement: false, equipements: [], selected: [] };
    state.daLines.push(line);
    renderDaLines();
    try {
      const r = await api(`/da/articles/${art.id}/equipements`);
      line.requires_equipement = !!r.requires_equipement;
      line.equipements = r.equipements || [];
      renderDaLines();
    } catch (e) {
      showToast(e.message, true);
    }
  }

  function renderDaLines() {
    const box = document.getElementById('da-lines');
    if (!box) return;
    if (state.daLines.length === 0) {
      box.innerHTML = '<div class="empty">Aucun article ajouté</div>';
      return;
    }
    box.innerHTML = state.daLines.map((l, i) => `
      <div class="card" style="margin:8px 0;padding:10px">
        <div class="line-item" style="padding:0">
          <div class="line-name">${escapeHtml(l.name)}</div>
          <input type="number" min="0.01" step="0.01" value="${l.qty}" data-idx="${i}" class="da-qty" />
          <button class="ghost" data-idx="${i}" data-action="da-remove">✕</button>
        </div>
        ${l.requires_equipement ? `
          <label>Équipements concernés</label>
          ${l.equipements.length === 0 ? '<div class="muted">Aucun équipement lié</div>' : l.equipements.map((e) => `
            <label style="display:flex;gap:8px;align-items:center;margin:4px 0">
              <input type="checkbox" data-idx="${i}" data-eq="${e.id}" class="da-eq" ${l.selected.includes(e.id) ? 'checked' : ''} style="width:auto" />
              <span>${escapeHtml(e.designation || e.nom || e.code || ('#' + e.id))}</span>
            </label>`).join('')}`
        : `
          <label>Motif</label>
          <textarea data-idx="${i}" class="da-motif" maxlength="500" rows="2" placeholder="Pourquoi cet article ?">${escapeHtml(l.motif)}</textarea>`}
      </div>
    `).join('');
    box.querySelectorAll('.da-qty').forEach((inp) => {
      inp.oninput = () => { state.daLines[Number(inp.dataset.idx)].qty = Number(inp.value); };
    });
    box.querySelectorAll('.da-motif').forEach((inp) => {
      inp.oninput = () => { state.daLines[Number(inp.dataset.idx)].motif = inp.value; };
    });
    box.querySelectorAll('.da-eq').forEach((inp) => {
      inp.onchange = () => {
        const l = state.daLines[Number(inp.dataset.idx)];
        const id = Number(inp.dataset.eq);
        l.selected = inp.checked ? [...new Set([...l.selected, id])] : l.selected.filter((x) => x !== id);
      };
    });
    box.querySelectorAll('[data-action=da-remove]').forEach((btn) => {
      btn.onclick = () => { state.daLines.splice(Number(btn.dataset.idx), 1); renderDaLines(); };
    });
  }

  async function submitDa() {
    const errBox = document.getElementById('da-error');
    const okBox = document.getElementById('da-success');
    errBox.textContent = ''; okBox.textContent = '';
    const delai = Number(document.getElementById('da-delai').value);
    const periode = document.getElementById('da-periode').value;
    const dem = document.getElementById('da-demandeur');
    if (!(delai > 0)) { errBox.textContent = 'Indiquez un délai supérieur à 0.'; return; }
    if (state.daLines.length === 0) { errBox.textContent = 'Ajoutez au moins un article.'; return; }
    for (const l of state.daLines) {
      if (!(l.qty > 0)) { errBox.textContent = `Quantité invalide : ${l.name}`; return; }
      if (l.requires_equipement && l.selected.length === 0) { errBox.textContent = `Choisissez au moins un équipement : ${l.name}`; return; }
      if (!l.requires_equipement && !l.motif.trim()) { errBox.textContent = `Indiquez un motif : ${l.name}`; return; }
    }
    const btn = document.getElementById('submit-da');
    btn.disabled = true;
    try {
      await api('/da', {
        method: 'POST',
        body: {
          delai, periode,
          ...(dem ? { id_demandeur: Number(dem.value) } : {}),
          lines: state.daLines.map((l) => ({
            id_article: l.id, qt: l.qty,
            motif: l.requires_equipement ? '' : l.motif.trim(),
            id_equipements: l.requires_equipement ? l.selected : []
          }))
        }
      });
      showToast('✓ Demande d\'achat envoyée');
      okBox.textContent = 'Demande envoyée.';
      state.daLines = [];
      state.sub.da = 'mine';   // show the request in the list right away
      renderTab();
    } catch (e) {
      errBox.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  }

    const box = document.getElementById('da-mine');

      const rows = await api('/da/mine');
      if (rows.length === 0) { box.innerHTML = '<div class="empty">Aucune demande</div>'; return; }
      box.innerHTML = rows.map((d) => `

          <div class="name">DA #${d.id} · ${escapeHtml(d.statut_label)}</div>
          <div class="code">${d.date_da ? new Date(d.date_da).toLocaleDateString('fr-FR') : ''}${d.demandeur ? ' · ' + escapeHtml(d.demandeur) : ''}</div>
          ${(d.lines || []).map((l) => `<div class="code">• ${escapeHtml(l.designation || l.code_article || 'Article')} × ${l.qt}</div>`).join('')}
          ${d.cause ? `<div class="error">Refus : ${escapeHtml(d.cause)}</div>` : ''}
        </div>`).join('');

  // ---- Atelier: solder / réceptionner un OF (ordre de fabrication) -------
  // Same rules as the desktop reception screen: each reception adds to the
  // stock; the OF becomes "Partiellement Soldé" until everything ordered is
  // received, then "Soldé". The server enforces all of it.
  function ofStatusPill(etat) {
    const low = etat !== 'Soldé' && etat !== 'Partiellement Soldé';
    return `<span class="stock-pill ${low ? 'low' : ''}">${escapeHtml(etat || '—')}</span>`;
  }
  const fmtQty = (n) => String(Math.round(Number(n) * 10000) / 10000);


  // ---- Parc: diesel per engine (read only) --------------------------------
  function parcPeriod() {
    if (!state.parc) {
      const to = new Date(); const from = new Date(); from.setDate(from.getDate() - 30);
      state.parc = { from: isoDate(from), to: isoDate(to) };
    }
    return state.parc;
  }
  const fmtL = (n) => (Math.round(Number(n || 0) * 10) / 10).toLocaleString('fr-FR') + ' L';
  const fmtMoney = (n) => Number(n || 0).toLocaleString('fr-FR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const alertLabel = (a) => (a.alertes || []).map((k) =>
    k === 'quantite' ? `Quantité +${a.ecart_qte} %` : k === 'compteur' ? 'Compteur non saisi' : `Consommation/compteur +${a.ecart_taux} %`).join(' · ');

  function parcPeriodCard(onChange) {
    const P = parcPeriod();
    return `<div class="card" style="padding:10px"><div style="display:flex;gap:8px">
      <label style="flex:1" class="muted">Du<input type="date" id="parc-from" value="${P.from}" max="${isoDate()}" /></label>
      <label style="flex:1" class="muted">Au<input type="date" id="parc-to" value="${P.to}" max="${isoDate()}" /></label>
    </div><div style="display:flex;gap:6px;margin-top:8px"><button type="button" class="ghost parc-pre" data-p="m0" style="flex:1;padding:6px">Ce mois</button><button type="button" class="ghost parc-pre" data-p="m1" style="flex:1;padding:6px">Mois dernier</button><button type="button" class="ghost parc-pre" data-p="d30" style="flex:1;padding:6px">30 jours</button></div></div>`;
  }
  function wireParcPeriod(reload) {
    const P = parcPeriod();
    const f = document.getElementById('parc-from'); const t = document.getElementById('parc-to');
    const apply = () => { if (f.value && t.value) { P.from = f.value; P.to = t.value; reload(); } };
    f.onchange = apply; t.onchange = apply;
    document.querySelectorAll('.parc-pre').forEach((b) => { b.onclick = () => {
      const now = new Date(); let from, to = new Date(now);
      if (b.dataset.p === 'm0') from = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (b.dataset.p === 'm1') { from = new Date(now.getFullYear(), now.getMonth() - 1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); }
      else { from = new Date(now); from.setDate(from.getDate() - 30); }
      P.from = isoDate(from); P.to = isoDate(to); f.value = P.from; t.value = P.to; reload();
    }; });
  }

  async function renderParcConso(root) {
    root.innerHTML = parcPeriodCard() + '<div id="parc-body"><div class="card"><div class="empty">Chargement…</div></div></div>';
    const load = async () => {
      const box = document.getElementById('parc-body'); if (!box) return;
      const P = parcPeriod();
      try {
        const d = await api(`/carburant/engins?from=${P.from}&to=${P.to}`);
        if (d.engins.length === 0) { box.innerHTML = '<div class="card"><div class="empty">Aucune sortie de carburant sur cette période</div></div>'; return; }
        box.innerHTML = `
          <div class="card"><strong>${fmtL(d.total_litres)}</strong> · ${fmtMoney(d.total_cout)}
            <div class="muted">${d.engins.length} engin(s) · du ${frDate(d.from)} au ${frDate(d.to)}</div></div>
          <div class="card">${d.engins.map((e) => `
            <div class="article-row" data-e="${e.id_engin}" style="cursor:pointer">
              <div style="min-width:0;flex:1">
                <div class="name">${e.rang}. ${escapeHtml(e.engin)} ${e.matricule ? '· ' + escapeHtml(e.matricule) : ''}</div>
                <div style="height:5px;background:var(--line);border-radius:3px;margin:3px 0"><div style="height:5px;width:${d.total_litres > 0 ? Math.max(2, Math.round(e.litres / d.engins[0].litres * 100)) : 0}%;background:var(--accent);border-radius:3px"></div></div>
                <div class="code">${escapeHtml(e.vehicule)} · ${e.nb_sorties} sortie(s) · dernière le ${frDate(e.derniere_date)}${e.dernier_compteur ? ' · compteur ' + fmtQty(e.dernier_compteur) : ''}</div>
              </div>
              <div style="text-align:right;white-space:nowrap;flex-shrink:0;padding-left:8px"><strong>${fmtL(e.litres)}</strong>
                <div class="muted">${d.total_litres > 0 ? (e.litres / d.total_litres * 100).toFixed(1).replace('.', ',') + ' %' : ''}</div>
                ${e.nb_alertes ? `<div><span class="stock-pill low">⚠ ${e.nb_alertes}</span></div>` : ''}
                ${e.nb_sans_compteur ? `<div><span class="stock-pill low" title="Sorties sans compteur">🔢 ${e.nb_sans_compteur}</span></div>` : ''}</div>
            </div>`).join('')}</div>`;
        box.querySelectorAll('[data-e]').forEach((r) => { r.onclick = () => openEnginSheet(Number(r.dataset.e)); });
      } catch (e) { box.innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`; }
    };
    wireParcPeriod(load);
    load();
  }

  function enginFicheHtml(f) {
    const chip = (txt, bad) => `<span class="stock-pill ${bad ? 'low' : ''}" style="margin:2px 4px 2px 0;display:inline-block">${txt}</span>`;
    const papers = f.papiers.length ? f.papiers.map((x) => chip(`${escapeHtml(x.type)} : ${x.etat === 'expire' ? `expiré (${-x.jours} j)` : frDate(x.date_exp)}`, x.etat === 'expire' || x.etat === 'bientot')).join('') : '<span class="muted">Aucun papier enregistré</span>';
    const cpt = f.compteurs.map((c) => { const pct = c.lancement > 0 ? Math.min(100, Math.round(c.valeur / c.lancement * 100)) : 0;
      return `<div style="margin:4px 0"><div style="display:flex;justify-content:space-between;font-size:0.85rem"><span>${escapeHtml(c.nom)}</span><span>reste ${fmtQty(c.restant)} / ${fmtQty(c.lancement)}</span></div><div style="height:6px;background:var(--line);border-radius:3px"><div style="height:6px;width:${pct}%;background:${pct >= 90 ? 'var(--danger, #b3261e)' : 'var(--accent)'};border-radius:3px"></div></div></div>`; }).join('');
    return `<div class="muted">${[f.vehicule, f.marque, f.num_carte && 'carte ' + f.num_carte, f.chauffeur && 'chauffeur ' + f.chauffeur, f.categorie].filter(Boolean).map(escapeHtml).join(' · ')}</div>
      <h3 style="margin:10px 0 4px">Papiers</h3>${papers}
      ${f.lie_equipement ? `<h3 style="margin:10px 0 4px">Maintenance</h3>
        <div>${chip(`DI ouvertes : ${f.di.ouvertes}`, f.di.ouvertes > 0)}${chip(`OT ouverts : ${f.ot.ouverts}`, false)}${f.pieces.montant != null ? chip(`Pièces ${frDate(f.from)} → ${frDate(f.to)} : ${fmtMoney0(f.pieces.montant)}`, false) : chip(`Lignes de pièces : ${f.pieces.lignes}`, false)}</div>
        ${cpt ? `<div style="margin-top:6px"><span class="muted">Compteurs préventifs</span>${cpt}</div>` : ''}` : '<div class="muted" style="margin-top:8px">Cet engin n\'est pas lié à un équipement : pas de données de maintenance.</div>'}`;
  }

  const SEUILS = [['def', 'Par défaut (+50 %)'], ['1.2', '+20 % (très sensible)'], ['1.3', '+30 %'], ['1.75', '+75 %'], ['2', '+100 %'], ['off', 'Alertes désactivées']];
  const seuilValue = (s) => (s.actif === false ? 'off' : s.ratio ? String(s.ratio) : 'def');
  const canSetSeuil = () => can('parc.seuils');
  async function openEnginSheet(idEngin) {
    const P = parcPeriod();
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:flex;align-items:flex-end';
    overlay.innerHTML = '<div id="eng-sheet" style="background:var(--panel);width:100%;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))"><div class="empty">Chargement…</div></div>';
    document.body.appendChild(overlay);
    const sheet = overlay.querySelector('#eng-sheet');
    const close = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
    try {
      const [d, fiche] = await Promise.all([api(`/carburant/engins/${idEngin}?from=${P.from}&to=${P.to}`), api(`/parc/engins/${idEngin}/fiche?from=${P.from}&to=${P.to}`).catch(() => null)]);
      const litres = d.sorties.reduce((s, x) => s + x.quantite, 0);
      sheet.innerHTML = `
        <h2 style="margin-top:0">${escapeHtml(d.engin)} ${d.matricule ? '· ' + escapeHtml(d.matricule) : ''}</h2>
        ${fiche && Array.isArray(fiche.papiers) ? enginFicheHtml(fiche) : ''}
        <h3 style="margin:12px 0 4px">Carburant</h3>
        <div class="muted" style="margin-bottom:8px">${escapeHtml(d.vehicule)} · ${frDate(d.from)} → ${frDate(d.to)} · ${d.sorties.length} sortie(s) · ${fmtL(litres)}</div>
        ${d.sorties.map((x) => `
          <div class="line-item" style="align-items:flex-start">
            <div class="line-name" style="min-width:0">
              <strong>${frDate(x.date)} ${escapeHtml(x.heure || '')}</strong> · ${escapeHtml(x.carburant)}<br>
              <span class="muted">${x.compteur ? 'compteur ' + fmtQty(x.compteur) : 'sans compteur'}${x.taux != null ? ' · ' + x.taux + ' L/unité' : ''} · ${fmtMoney(x.prix_ttc)}</span>
              ${x.alertes.length || x.sans_compteur ? `<br><span class="stock-pill low" style="white-space:normal;display:inline-block;max-width:100%">⚠ ${escapeHtml(alertLabel({ ...x, alertes: x.sans_compteur ? [...x.alertes, 'compteur'] : x.alertes }))}</span>` : ''}
            </div>
            <strong style="white-space:nowrap;padding-left:8px">${fmtL(x.quantite)}</strong>
          </div>`).join('') || '<div class="empty">Aucune sortie</div>'}
        ${canSetSeuil() && d.seuil ? `<label style="margin-top:12px">Seuil d'alerte de cet engin</label>
          <select id="eng-seuil">${SEUILS.map(([v, l]) => `<option value="${v}" ${seuilValue(d.seuil) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}

  async function renderAtelierList(root, statut) {
    root.innerHTML = `
      <div class="card">

    const input = document.getElementById('of-search');

  async function openOfSheet(idOf) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:flex;align-items:flex-end';
    overlay.innerHTML = '<div id="of-sheet" style="background:var(--panel);width:100%;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))"><div class="empty">Chargement…</div></div>';
    document.body.appendChild(overlay);
    const sheet = overlay.querySelector('#of-sheet');
    let changed = false;
    const close = () => { overlay.remove(); if (changed) renderTab(); };
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    async function draw() {
      let of;
      try { of = await api('/atelier/of/' + idOf); }
      catch (e) { sheet.innerHTML = `<div class="error">${escapeHtml(e.message)}</div><button class="ghost" id="of-close" style="width:100%">Fermer</button>`; sheet.querySelector('#of-close').onclick = close; return; }
      const canReceive = of.can_write && of.reste > 0;
      const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      sheet.innerHTML = `
        <h2 style="margin-top:0">OF ${escapeHtml(of.n_of)}</h2>
        <div style="margin-bottom:4px"><strong>${escapeHtml(of.designation || '')}</strong></div>
        <div class="muted">${escapeHtml(of.code_article || '')}</div>
        <div style="margin:10px 0">${ofStatusPill(of.etat)}
          <span class="muted"> demandé ${fmtQty(of.quantite)} · reçu ${fmtQty(of.qt_recue)} · reste ${fmtQty(of.reste)}</span></div>
        ${of.receptions.length ? `<label>Réceptions</label>` + of.receptions.map((r) => `
          <div class="line-item">
            <div class="line-name">${new Date(r.date_reception).toLocaleDateString('fr-FR')} · ${fmtQty(r.qt_recu)}</div>
            ${of.can_write ? `<button class="ghost" data-undo="${r.id}" title="Annuler cette réception">✕</button>` : ''}
          </div>`).join('') : ''}
        ${canReceive ? `
          <label>Quantité reçue</label>
          <input id="of-qty" type="number" min="0.01" max="${of.reste}" step="0.01" value="${of.reste}" />
          <label>Date de réception</label>
          <input id="of-date" type="date" max="${iso}" value="${iso}" />
          <button class="primary" id="of-go"></button>
          <div class="error" id="of-error"></div>` : (of.reste <= 0 ? '<div class="success" style="margin-top:8px">Cet OF est entièrement soldé.</div>' : '')}
        <button class="ghost" id="of-close" style="width:100%;margin-top:8px">Fermer</button>`;
      sheet.querySelector('#of-close').onclick = close;

      const qtyEl = sheet.querySelector('#of-qty'), goEl = sheet.querySelector('#of-go');
      if (qtyEl) {
        // The button says what the result will be, as in the desktop app.
        const label = () => {
          const q = Number(qtyEl.value);
          goEl.textContent = q > 0 && Math.abs(q - of.reste) < 1e-4 ? '✓ Solder l\'OF' : 'Réceptionner (partiel)';
        };
        qtyEl.oninput = label; label();
        goEl.onclick = async () => {
          const err = sheet.querySelector('#of-error'); err.textContent = '';
          const qt = Number(qtyEl.value);
          if (!(qt > 0)) { err.textContent = 'Saisissez une quantité supérieure à 0.'; return; }
          if (qt > of.reste + 1e-4) { err.textContent = `Maximum : ${fmtQty(of.reste)}.`; return; }
          goEl.disabled = true;
          try {
            const r = await api(`/atelier/of/${idOf}/receptions`, { method: 'POST', body: { qt, date: sheet.querySelector('#of-date').value } });
            changed = true;
            showToast(r.etat === 'Soldé' ? '✓ OF soldé' : '✓ Réception enregistrée (partiellement soldé)');
            draw();
          } catch (e) { err.textContent = e.message; goEl.disabled = false; }
        };
      }
      sheet.querySelectorAll('[data-undo]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Annuler cette réception ? La quantité sera retirée du stock.')) return;
          try {
            await api(`/atelier/of/${idOf}/receptions/${b.dataset.undo}`, { method: 'DELETE' });
            changed = true; showToast('Réception annulée'); draw();
          } catch (e) { showToast(e.message, true); }
        };
      });
    }
    draw();
  }

  // ---- Magasin / Production menus -------------------------------------
  // Two bottom-nav entries. Each opens a menu of big buttons; a button opens
  // the screen it names, with a "‹" button to come back to the menu.
  function bigButton(id, icon, label, sub) {
    return `<button type="button" class="big-btn" data-go="${id}">
      <span class="bb-icon">${icon}</span>
      <span class="bb-text"><span class="bb-label">${label}</span><span class="bb-sub">${sub}</span></span>
      <span class="bb-arrow">›</span>
    </button>`;
  }

  function renderMagasin() {
    const items = [];
    if (can('bsm.create')) items.push(bigButton('bsm', '📤', 'BSM', 'Bon de sortie magasin'));
    if (can('brm.create')) items.push(bigButton('brm', '↩️', 'BRM', 'Bon de retour magasin'));
    if (canCreateDa() || can('da.review')) items.push(bigButton('da', '🛒', "DA", "Demande d'achat"));
    if (can('stock.insight') || can('stock.valuation')) items.push(bigButton('analyse', '📊', 'Analyse stock', 'Sous minimum, dormant, valeur'));
    if (can('achats.view')) items.push(bigButton('achats', '🧾', 'Achats', 'Synthèse, commandes, BL, factures'));
    if (can('reception.use')) items.push(bigButton('reception', '📥', 'Réception', 'Bons de commande en attente'));
    document.getElementById('main').innerHTML = `<div class="big-menu">${items.join('')}</div>`;
    document.querySelectorAll('.big-btn').forEach((b) => {
      b.onclick = () => { state.tab = b.dataset.go; state.error = ''; state.notice = ''; renderTab(); };
    });
  }

  // ---- Production reports (mirrors the desktop "Rapport" screens) --------
  const POSTES = ['Jour', 'Soir', 'Nuit'];
  // Clay heap icon for "Préparation" (clay preparation line of a brick factory).
  // Inline SVG instead of an emoji: identical on every Android version.
  const CLAY_ICON = '<svg viewBox="2 12 60 48" width="1.3em" height="1.04em" style="vertical-align:-0.12em" aria-hidden="true">'
    + '<path d="M4 56h56" stroke="#8a7f74" stroke-width="3" stroke-linecap="round"/>'
    + '<ellipse cx="20" cy="46" rx="16" ry="10" fill="#b8451f"/>'
    + '<ellipse cx="44" cy="46" rx="16" ry="10" fill="#a33a19"/>'
    + '<ellipse cx="32" cy="29" rx="16" ry="11" fill="#d1592f"/>'
    + '<path d="M22 25c3-5 9-7 14-6" stroke="#f0a583" stroke-width="3" fill="none" stroke-linecap="round"/>'
    + '<path d="M10 42c2-3 5-4 8-4" stroke="#e08a63" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    + '<path d="M38 42c2-3 5-4 8-4" stroke="#c9663f" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
  const PROD_SECTIONS = [
    ['fabrication', '🧱', 'Fabrication', 'Produits, tonnage, mesures, chef d\'équipe'],
    ['four', '🔥', 'Four', 'Entrée, sortie, mesures'],
    ['preparation', CLAY_ICON, 'Préparation', 'Mesures, A/S, général'],
    ['fuel', '⛽', 'Fuel', 'Consommations'],
    ['emballage', '📦', 'Emballage', 'Produits, palettes, chef d\'équipe']
  ];
  const isoDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const frDate = (iso) => String(iso).split('-').reverse().join('/');

  function setBack(label, fn) {
    const bar = document.getElementById('backbar');
    if (!bar) return;
    if (!label) { bar.innerHTML = ''; return; }
    bar.innerHTML = `<button type="button" class="ghost back-btn" id="back-btn">‹ ${escapeHtml(label)}</button>`;
    document.getElementById('back-btn').onclick = fn;
  }

  function prodState() {
    if (!state.prod) state.prod = { view: 'list', id: null, section: null, unit: {}, data: null, date: '', poste: '' };
    return state.prod;
  }

  function renderRapports() {
    const P = prodState();
    if (P.view === 'list') return renderRapportList();
    if (!P.data) return openReport(P.id);
    if (P.view === 'report') return renderRapportHome();
    return renderRapportSection();
  }

  async function renderRapportList() {
    const P = prodState();
    const main = document.getElementById('main');
    setBack(null);
    main.innerHTML = '<div class="card"><div class="empty">Chargement…</div></div>';
    let res;
    try { res = await api('/production/reports'); }
    catch (e) { main.innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`; return; }
    if (state.tab !== 'rapports' || P.view !== 'list') return;
    const today = isoDate();
    if (!P.date) P.date = today;
    main.innerHTML = `
      ${res.can_write ? `<div class="card">
        <h2>Nouveau rapport</h2>
        <label>Date</label>
        <input id="rp-date" type="date" max="${today}" value="${P.date}" />
        <label>Poste</label>
        <div class="segmented" id="rp-poste">${POSTES.map((p) => `<button type="button" data-v="${p}" class="${p === P.poste ? 'selected' : ''}">${p}</button>`).join('')}</div>
        <button class="primary" id="rp-create" style="margin-top:12px">Créer le rapport</button>
        <div class="error" id="rp-err"></div>
      </div>` : ''}
      <div class="card">
        <h2>Rapports récents</h2>
        <div id="rp-list">${res.reports.length === 0 ? '<div class="empty">Aucun rapport</div>' : res.reports.map((r) => `
          <div class="article-row" data-rp="${r.id}" style="cursor:pointer">
            <div><div class="name">${frDate(r.date_rapport)} · ${escapeHtml(r.poste)}</div><div class="code">Rapport n° ${r.id}</div></div>
            ${res.can_write ? `<button type="button" class="ghost" data-del="${r.id}" title="Supprimer ce rapport">✕</button>` : '<span class="muted">›</span>'}
          </div>`).join('')}</div>
      </div>`;
    main.querySelectorAll('[data-rp]').forEach((row) => {
      row.onclick = (e) => { if (e.target.closest('[data-del]')) return; openReport(Number(row.dataset.rp)); };
    });
    main.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('Supprimer ce rapport ? Le tonnage de fabrication sera retiré des compteurs.')) return;
        try { await api('/production/reports/' + b.dataset.del, { method: 'DELETE' }); showToast('Rapport supprimé'); renderRapportList(); }
        catch (e) { showToast(e.message, true); }
      };
    });
    const create = document.getElementById('rp-create');
    if (create) {
      document.getElementById('rp-date').onchange = (e) => { P.date = e.target.value; };
      main.querySelectorAll('#rp-poste button').forEach((b) => {
        b.onclick = () => { P.poste = b.dataset.v; main.querySelectorAll('#rp-poste button').forEach((x) => x.classList.toggle('selected', x === b)); };
      });
      create.onclick = async () => {
        const err = document.getElementById('rp-err'); err.textContent = '';
        if (!P.poste) { err.textContent = 'Choisissez le poste.'; return; }
        create.disabled = true;
        try {
          const r = await api('/production/reports', { method: 'POST', body: { date: P.date, poste: P.poste } });
          showToast('✓ Rapport créé');
          P.poste = '';
          openReport(r.id);
        } catch (e) { err.textContent = e.message; create.disabled = false; }
      };
    }
  }

  async function openReport(id) {
    const P = prodState();
    const main = document.getElementById('main');
    P.id = id; P.view = 'report'; P.section = null; P.data = null;
    setBack('Rapports', () => { P.view = 'list'; P.data = null; renderRapports(); });
    main.innerHTML = '<div class="card"><div class="empty">Chargement…</div></div>';
    try { await reloadReport(); }
    catch (e) { main.innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`; return; }
    renderRapports();
  }

  async function reloadReport() {
    const P = prodState();
    P.data = await api('/production/reports/' + P.id, { fresh: true });
  }

  function renderRapportHome() {
    const P = prodState(); const d = P.data;
    const main = document.getElementById('main');
    setBack('Rapports', () => { P.view = 'list'; P.data = null; renderRapports(); });
    main.innerHTML = `
      <div class="card">
        <h2>Rapport du ${frDate(d.date_rapport)} · ${escapeHtml(d.poste)}</h2>

      b.onclick = () => { P.view = 'section'; P.section = b.dataset.go; renderRapports(); };

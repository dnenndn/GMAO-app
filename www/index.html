  // -- helpers shared by the section screens
  const pIn = (attrs, v, ro) => `<input class="pf" type="text" inputmode="decimal" autocomplete="off" ${attrs} value="${v === null || v === undefined ? '' : escapeHtml(String(Math.round(Number(v) * 10000) / 10000))}" ${ro ? 'disabled' : ''} />`;
  const pRow = (name, inner) => `<div class="line-item"><div class="line-name">${escapeHtml(name)}</div>${inner}</div>`;

  function unitPicker(section, units) {
    const P = prodState();
    if (units.length === 0) return { unit: null, html: '<div class="card"><div class="empty">Aucune unité pour cette section.</div></div>' };
    let cur = units.find((u) => u.id_unite === P.unit[section]) || units[0];
    P.unit[section] = cur.id_unite;
    const html = units.length > 1
      ? `<div class="card" style="padding:10px"><div class="segmented" id="unit-nav">${units.map((u) => `<button type="button" data-u="${u.id_unite}" class="${u.id_unite === cur.id_unite ? 'selected' : ''}">${escapeHtml(u.unite)}</button>`).join('')}</div></div>`
      : `<div class="muted" style="margin:0 2px 8px">${escapeHtml(cur.unite)}</div>`;
    return { unit: cur, html };
  }

  // One group of fields with its own save button.
  function block(title, body, id, canWrite, note) {
    return `<details class="card prod-block" ${id === 'open' ? 'open' : ''}>
      <summary>${title}</summary>
      ${note ? `<div class="muted" style="margin:6px 0">${note}</div>` : ''}
      ${body}
      ${canWrite ? '<button type="button" class="primary prod-save" style="margin-top:12px">Enregistrer</button>' : ''}
      <div class="error"></div>
    </details>`;
  }

  // Re-draws the current screen and keeps the same blocks open.
  async function rerenderKeepOpen() {
    const open = [...document.querySelectorAll('#main details')].map((x) => x.open);
    await renderRapports();
    document.querySelectorAll('#main details').forEach((x, k) => { x.open = !!open[k]; });
  }

  // Pairs the blocks that have a save button (in order) with saves[i](blockEl)
  // -> { method?, path, body, toast? }; a save may throw a message to show.
  function wireBlocks(root, saves) {
    const els = [...root.querySelectorAll('details.prod-block:not(.anomalies)')].filter((e) => e.querySelector('.prod-save'));
    els.forEach((el, i) => {
      const btn = el.querySelector('.prod-save');
      if (!saves[i]) return;
      btn.onclick = async () => {
        const err = el.querySelector('.error'); err.textContent = '';
        let req;
        try { req = saves[i](el); } catch (e) { err.textContent = e.message; return; }
        btn.disabled = true;
        try {
          const r = await api(req.path, { method: req.method || 'PUT', body: req.body });
          await reloadReport();
          showToast(req.toast ? req.toast(r) : '✓ Enregistré');
          await rerenderKeepOpen();
        } catch (e) { err.textContent = e.message; btn.disabled = false; }
      };
    });
  }

  const readNum = (el) => el.value.trim();
  const rowsOf = (el, attr, fields) => [...el.querySelectorAll(`[data-${attr}]`)].reduce((acc, inp) => {
    const id = Number(inp.dataset[attr]);
    let row = acc.find((r) => r.id === id);
    if (!row) { row = { id }; acc.push(row); }
    row[inp.dataset.f || 'valeur'] = readNum(inp);
    return acc;
  }, []);

  function anomalyBlock(d, unit) {
    const list = d.anomalies.filter((a) => a.id_unite === unit.id_unite);
    const opts = d.anomalie_options[unit.id_unite] || [];
    return `<details class="card prod-block anomalies" data-unit="${unit.id_unite}">
      <summary>Arrêts / anomalies${list.length ? ` (${list.length})` : ''}</summary>
      ${list.map((a) => `<div class="line-item"><div class="line-name">${escapeHtml(a.anomalie)}<br><span class="muted">${a.duree} min</span></div>${d.can_write ? `<button type="button" class="ghost" data-adel="${a.id}">✕</button>` : ''}</div>`).join('')}
      ${d.can_write && (opts.length || can('production.anomalie_create')) ? `
        <label>Anomalie</label>
        <select class="an-sel">${opts.map((o) => `<option value="${o.id}">${escapeHtml(o.anomalie)}</option>`).join('')}${can('production.anomalie_create') ? '<option value="new">➕ Autre anomalie…</option>' : ''}</select>
        <input class="an-new" type="text" maxlength="100" placeholder="Nom de la nouvelle anomalie" style="display:none;margin-top:8px" />
        <label>Durée (minutes)</label>
        <input class="an-dur" type="text" inputmode="numeric" placeholder="ex. 45" />
        <button type="button" class="primary an-add" style="margin-top:12px">Ajouter</button>` : ''}
      <div class="error"></div>
    </details>`;
  }

  function wireAnomalies(root) {
    const P = prodState();
    root.querySelectorAll('details.anomalies').forEach((el) => {
      const unit = Number(el.dataset.unit);
      const err = el.querySelector('.error');
      const refresh = async (msg) => { await reloadReport(); showToast(msg); await rerenderKeepOpen(); };
      const add = el.querySelector('.an-add');
      const sel = el.querySelector('.an-sel'); const nw = el.querySelector('.an-new');
      if (sel) { const sync = () => { nw.style.display = sel.value === 'new' ? 'block' : 'none'; }; sel.onchange = sync; sync(); }
      if (add) add.onclick = async () => {
        err.textContent = '';
        const duree = Number(el.querySelector('.an-dur').value.trim());
        const isNew = sel.value === 'new';
        const nom = isNew ? nw.value.trim().replace(/\s+/g, ' ') : '';
        if (isNew && nom.length < 3) { err.textContent = "Saisissez le nom de l'anomalie (3 caractères minimum)."; return; }
        if (!Number.isInteger(duree) || duree <= 0) { err.textContent = 'Durée : nombre entier de minutes supérieur à 0.'; return; }
        add.disabled = true;
        try {
          await api(`/production/reports/${P.id}/anomalies`, { method: 'POST', body: isNew ? { id_unite: unit, nouvelle: nom, duree } : { id_unite: unit, id_anomalie: Number(sel.value), duree } });
          await refresh(isNew ? '✓ Nouvelle anomalie créée et ajoutée' : '✓ Anomalie ajoutée');
        } catch (e) { err.textContent = e.message; add.disabled = false; }
      };
      el.querySelectorAll('[data-adel]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Supprimer cette anomalie ?')) return;
          try { await api(`/production/reports/${P.id}/anomalies/${b.dataset.adel}`, { method: 'DELETE' }); await refresh('Anomalie supprimée'); }
          catch (e) { err.textContent = e.message; }
        };
      });
    });
  }

  function chefBlock(unit, chefs, ro) {
    return block("Chef d'équipe", `
      <select class="cf-sel" ${ro ? 'disabled' : ''}>
        <option value="0">— choisir —</option>
        ${chefs.map((c) => `<option value="${c.id}" ${c.id === unit.id_cf ? 'selected' : ''}>${escapeHtml(c.nom)}</option>`).join('')}
      </select>`, '', !ro);
  }

  async function renderRapportSection() {
    const P = prodState(); const d = P.data; const sec = P.section;
    const main = document.getElementById('main');
    const meta = PROD_SECTIONS.find((s) => s[0] === sec);
    setBack('Rapport', () => { P.view = 'report'; P.section = null; renderRapports(); });
    const ro = !d.can_write;
    const base = `/production/reports/${P.id}`;
    const head = `<div class="card"><h2>${meta[1]} ${meta[2]} · ${frDate(d.date_rapport)} · ${escapeHtml(d.poste)}</h2>${ro ? '<div class="muted">Lecture seule.</div>' : ''}</div>`;

    if (sec === 'fuel') {
      main.innerHTML = head + block('Consommations de fuel', d.fuel.map((f) => pRow(`Qt Fuel ${f.label}`, pIn(`data-fuel="${f.type}"`, f.quantite, ro))).join(''), 'open', !ro, 'Laissez vide un champ non renseigné.');
      wireBlocks(main, [(el) => {
        const valeurs = {};
        el.querySelectorAll('[data-fuel]').forEach((i) => { valeurs[i.dataset.fuel] = readNum(i); });
        return { path: `${base}/fuel`, body: { valeurs } };
      }]);
      return;
    }

    let units = []; let chefs = [];
    if (sec === 'fabrication') units = d.fabrication;
    if (sec === 'four') units = d.four;
    if (sec === 'preparation') units = d.preparation.unites;
    if (sec === 'emballage') units = d.emballage;
    if ((sec === 'fabrication' || sec === 'emballage') && !ro) {
      try { chefs = await api('/production/chefs'); } catch (e) { chefs = []; }
      if (P.view !== 'section' || P.section !== sec) return;
    }
    const { unit, html } = unitPicker(sec, units);
    let blocks = ''; const saves = [];
    const S = (cond, fn) => { if (!ro && cond) saves.push(fn); };
    const unitUrl = (part) => `${base}/${sec}/${unit.id_unite}/${part}`;

    if (unit && sec === 'fabrication') {
      const b12 = d.produits.find((p) => String(p.designation).trim().toUpperCase() === 'B12');
      const prodOpts = (sel) => `<option value="0">— choisir —</option>` + d.produits.map((p) => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${escapeHtml(p.designation)}</option>`).join('');
      blocks += block('Production et tonnage', `
          ${unit.produits.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join('')}
          <label style="margin-top:14px">Produit fabriqué à chaque heure d'échantillonnage</label>
          ${!ro && b12 ? `<button type="button" class="ghost fill-b12" data-p="${b12.id}" style="margin:2px 0 4px">Remplir H1 à H8 avec ${escapeHtml(b12.designation)}</button>` : ''}
          <div class="hours-grid two">${unit.heures.map((h, k) => `<div><span class="muted">H${k + 1}</span><select data-h="${k}" ${ro ? 'disabled' : ''}>${prodOpts(h)}</select></div>`).join('')}</div>
          <div style="margin-top:12px"><strong>Tonnage : ${fmtQty(unit.tonnage)}</strong> <span class="muted">(calculé à l'enregistrement)</span></div>`,
      'open', !ro, 'Renseignez d\'abord les mesures horaires (poids sec), elles servent au calcul du tonnage.');
      S(true, (el) => {
        const heures = [...el.querySelectorAll('[data-h]')].map((s) => Number(s.value));
        if (heures.some((h) => !h)) throw new Error("Associez chaque heure d'échantillonnage à un produit.");
        return { path: unitUrl('produits'), body: { lignes: rowsOf(el, 'q'), heures }, toast: (r) => r.compteurs_modifies ? '✓ Enregistré — compteurs mis à jour (OT préventifs : à lancer depuis le PC)' : '✓ Enregistré' };
      });
      blocks += block('Mesures horaires', unit.horaire.map((h) => `
          <div style="margin-top:10px"><strong style="font-size:.9rem">${escapeHtml(h.designation)}</strong>
          <div class="hours-grid">${[1, 2, 3, 4, 5, 6, 7, 8].map((k) => `<div><span class="muted">H${k}</span>${pIn(`data-hr="${h.id}" data-f="h${k}"`, h['h' + k], ro)}</div>`).join('')}</div></div>`).join('') || '<div class="empty">Aucune mesure horaire</div>', '', !ro && unit.horaire.length > 0);
      S(unit.horaire.length > 0, (el) => ({ path: unitUrl('horaire'), body: { lignes: [...new Set([...el.querySelectorAll('[data-hr]')].map((i) => i.dataset.hr))].map((id) => ({ id: Number(id), h: [1, 2, 3, 4, 5, 6, 7, 8].map((k) => readNum(el.querySelector(`[data-hr="${id}"][data-f="h${k}"]`))) })) } }));
      blocks += block('Qualité', unit.qualite.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.qualite.length > 0);
      S(unit.qualite.length > 0, (el) => ({ path: unitUrl('qualite'), body: { lignes: rowsOf(el, 'v') } }));
      blocks += chefBlock(unit, chefs, ro);
      S(true, (el) => {
        const id_cf = Number(el.querySelector('.cf-sel').value);
        if (!id_cf) throw new Error("Choisissez un chef d'équipe.");
        return { path: unitUrl('cf'), body: { id_cf } };
      });
    }

    if (unit && sec === 'four') {
      blocks += block('Entrée du four', unit.entree.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join(''), 'open', !ro, 'Quantités entrées (le tonnage se calcule à l\'enregistrement).');
      S(true, (el) => ({ path: unitUrl('entree'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += block('Sortie du four', unit.sortie.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join(''), '', !ro);
      S(true, (el) => ({ path: unitUrl('sortie'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += block('Mesures du four', unit.champs.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.champs.length > 0, 'Le poids du four sert au calcul des tonnages d\'entrée et de sortie.');
      S(unit.champs.length > 0, (el) => ({ path: unitUrl('champs'), body: { lignes: rowsOf(el, 'v') } }));
    }

    if (unit && sec === 'preparation') {
      blocks += block('Mesures', unit.qualite.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', 'open', !ro && unit.qualite.length > 0);
      S(unit.qualite.length > 0, (el) => ({ path: unitUrl('qualite'), body: { lignes: rowsOf(el, 'v') } }));
      blocks += block('Valeurs A / S', unit.as.map((q) => `<div class="line-item"><div class="line-name">${escapeHtml(q.designation)}</div><span class="muted">A</span>${pIn(`data-as="${q.id}" data-f="valeur_a"`, q.valeur_a, ro)}<span class="muted">S</span>${pIn(`data-as="${q.id}" data-f="valeur_s"`, q.valeur_s, ro)}</div>`).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.as.length > 0);
      S(unit.as.length > 0, (el) => ({ path: unitUrl('as'), body: { lignes: rowsOf(el, 'as') } }));
    }

    if (unit && sec === 'emballage') {
      blocks += block('Produits emballés', unit.produits.map((p) => `
          <div style="padding:10px 0;border-bottom:1px solid var(--line)"><strong style="font-size:.9rem">${escapeHtml(p.designation)}</strong>
          <div class="hours-grid three">
            <div><span class="muted">Quantité</span>${pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro)}</div>
            <div><span class="muted">Bobines feuillard</span>${pIn(`data-q="${p.id}" data-f="nbr_bobine_feuillard"`, p.nbr_bobine_feuillard, ro)}</div>
            <div><span class="muted">Palettes</span>${pIn(`data-q="${p.id}" data-f="nbr_pallette"`, p.nbr_pallette, ro)}</div>
          </div></div>`).join(''), 'open', !ro);
      S(true, (el) => ({ path: unitUrl('produits'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += chefBlock(unit, chefs, ro);
      S(true, (el) => {
        const id_cf = Number(el.querySelector('.cf-sel').value);
        if (!id_cf) throw new Error("Choisissez un chef d'équipe.");
        return { path: unitUrl('cf'), body: { id_cf } };
      });
    }

    main.innerHTML = head + html + (unit ? blocks : '') + (unit ? anomalyBlock(d, unit) : '');

    // Préparation "général" belongs to the report, not to a unit.
    if (sec === 'preparation' && d.preparation.general.length) {
      const g = block('Général', d.preparation.general.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join(''), '', !ro);
      main.insertAdjacentHTML('beforeend', g);
      S(true, (el) => ({ path: `${base}/preparation/general`, body: { lignes: rowsOf(el, 'v') } }));
    }

    main.querySelectorAll('#unit-nav button').forEach((b) => {
      b.onclick = () => { P.unit[sec] = Number(b.dataset.u); renderRapports(); };
    });
    // One tap sets the 8 sampling hours to B12 (the usual product).
    main.querySelectorAll('.fill-b12').forEach((b) => {
      b.onclick = () => { b.closest('details').querySelectorAll('[data-h]').forEach((sel) => { sel.value = b.dataset.p; }); };
    });
    wireBlocks(main, saves);
    wireAnomalies(main);
  }

  // ---- Reception tab ---------------------------------------------------
  async function renderReception() {
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="card">
        <h2>Bons de commande en attente</h2>
        <div id="open-commandes"><div class="empty">Chargement…</div></div>
      </div>
    `;
    try {
      const commandes = await api('/reception/commandes/open');
      state.openCommandes = commandes;
      const box = document.getElementById('open-commandes');
      if (commandes.length === 0) {
        box.innerHTML = '<div class="empty">Aucun bon en attente</div>';
        return;
      }
      box.innerHTML = commandes.map((c) => `
        <div class="commande-row article-row" data-id="${c.id}" style="cursor:pointer">
          <div>
            <div class="name">${escapeHtml(c.fournisseur)}</div>
            <div class="code">${c.n_commande ? 'N° ' + escapeHtml(String(c.n_commande)) + ' · ' : ''}${new Date(c.date_commande).toLocaleDateString()}</div>
          </div>
        </div>
        <div class="accordion-detail" id="detail-${c.id}"></div>
      `).join('');
      box.querySelectorAll('.commande-row').forEach((row) => {
        row.onclick = () => toggleCommande(Number(row.dataset.id));
      });
    } catch (e) {
      document.getElementById('open-commandes').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function toggleCommande(idCommande) {
    const detail = document.getElementById(`detail-${idCommande}`);
    const row = document.querySelector(`.commande-row[data-id="${idCommande}"]`);
    const alreadyOpen = detail.style.maxHeight && detail.style.maxHeight !== '0px';

    // Collapse whatever else is open first - only one order expanded at a time.
    document.querySelectorAll('.accordion-detail').forEach((d) => { d.style.maxHeight = '0px'; });
    document.querySelectorAll('.commande-row').forEach((r) => r.classList.remove('expanded'));

    if (alreadyOpen) return; // tapping an open row just closes it

    row.classList.add('expanded');
    const commande = state.openCommandes.find((c) => c.id === idCommande);
    await loadCommandeLines(idCommande, commande, detail);
    // Measure after content is in place so the slide animates to the right height.
    detail.style.maxHeight = detail.scrollHeight + 'px';
  }

  async function loadCommandeLines(idCommande, commande, detail) {
    state.receptionCommande = idCommande;
    detail.innerHTML = `
      <div style="padding:14px 4px 4px">
        <div id="reception-header-${idCommande}" class="muted" style="margin-bottom:10px"></div>
        <div id="reception-lines-${idCommande}"><div class="empty">Chargement…</div></div>
        <button class="primary" id="submit-reception-${idCommande}">Valider la réception</button>
        <div class="error" id="reception-error-${idCommande}"></div>
        <div class="success" id="reception-success-${idCommande}"></div>
      </div>
    `;
    const headerBox = document.getElementById(`reception-header-${idCommande}`);
    headerBox.innerHTML = commande ? `
      <strong style="color:var(--ink)">${escapeHtml(commande.fournisseur)}</strong><br>
      ${commande.n_commande ? 'Bon N° ' + escapeHtml(String(commande.n_commande)) + ' · ' : ''}
      commandé le ${new Date(commande.date_commande).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}
    ` : '';
    const box = document.getElementById(`reception-lines-${idCommande}`);
    try {
      const lines = await api(`/reception/commandes/${idCommande}/lines`);
      state.receptionLines = lines.map((l) => ({ ...l, qt_saisie: Math.max(0, l.qt_commande - l.qt_recu) }));
      const remainingCount = state.receptionLines.filter((l) => l.qt_commande > l.qt_recu).length;
      headerBox.innerHTML += `<br><span class="muted">${state.receptionLines.length} article(s) au total · ${remainingCount} pas encore reçu(s)</span>`;
      box.innerHTML = state.receptionLines.map((l, i) => `
        <div class="line-item">
          <div class="line-name">${escapeHtml(l.designation)}<br><span class="muted">${escapeHtml(l.code_article || '')} · commandé ${l.qt_commande} · reçu ${l.qt_recu}</span></div>
          <input type="number" min="0" step="0.01" value="${l.qt_saisie}" data-idx="${i}" class="recv-qty" />
        </div>
      `).join('');
      box.querySelectorAll('.recv-qty').forEach((inp) => {
        inp.oninput = () => {
          state.receptionLines[Number(inp.dataset.idx)].qt_saisie = Number(inp.value);
          // Content height changed - keep the slide container sized to fit.
          detail.style.maxHeight = detail.scrollHeight + 'px';
        };
      });
      document.getElementById(`submit-reception-${idCommande}`).onclick = () => submitReception(idCommande, detail);
      // Re-measure now that real content replaced the loading spinner.
      detail.style.maxHeight = detail.scrollHeight + 'px';
    } catch (e) {
      box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      detail.style.maxHeight = detail.scrollHeight + 'px';
    }
  }

  async function submitReception(idCommande, detail) {
    const errBox = document.getElementById(`reception-error-${idCommande}`);
    const okBox = document.getElementById(`reception-success-${idCommande}`);
    errBox.textContent = ''; okBox.textContent = '';
    const lines = state.receptionLines
      .filter((l) => l.qt_saisie > 0)
      .map((l) => ({ id_article: l.id_article, id_da: l.id_da, qt_recu: l.qt_saisie, qt_bon_etat: l.qt_saisie, qt_mauvais_etat: 0 }));
    if (lines.length === 0) {
      errBox.textContent = 'Saisissez au moins une quantité reçue.';
      return;
    }
    try {
      await api('/reception', { method: 'POST', body: { id_commande: idCommande, lines } });
      okBox.textContent = 'Réception enregistrée.';
      showToast('✓ Réception validée avec succès');
      renderReception();
    } catch (e) {
      errBox.textContent = e.message;
      detail.style.maxHeight = detail.scrollHeight + 'px';
    }
  }

        <div class="commande-row article-row" data-id="${b.id}" style="cursor:pointer">

            <div class="name">BSM #${b.id} · ${escapeHtml(b.type_stock || '')}${b.n_ot ? ' · OT ' + escapeHtml(b.n_ot) : ''}</div>

  function toggleBrmSource(idBsm) {
    const detail = document.getElementById(`brm-detail-${idBsm}`);
    const row = document.querySelector(`#brm-bsm-list .commande-row[data-id="${idBsm}"]`);
    const alreadyOpen = detail.style.maxHeight && detail.style.maxHeight !== '0px';

    // Only one source expanded at a time, same as the Réception list.

    if (alreadyOpen) return;

    row.classList.add('expanded');
    selectBrmSource(idBsm, detail);
    detail.style.maxHeight = detail.scrollHeight + 'px';
  }

  function selectBrmSource(idBsm, detail) {
    const bsm = state.brmSourceOptions.find((b) => b.id === idBsm);
    if (!bsm) return;
    state.brmSource = bsm;
    state.brmReturnLines = bsm.lines.map((l) => ({
      id_article: l.id_article, name: l.designation, code: l.code_article, max: l.restant, qty: l.restant
    }));

    detail.innerHTML = `
      <div style="padding:14px 4px 4px">
        <label>Motif du retour</label>
        <select id="type_retour-${idBsm}"><option>Chargement…</option></select>
        <label>Type de stock</label>
        <div class="segmented" id="brm_type_stock-${idBsm}">

  async function submitBrm(idBsm, detail) {
    const errBox = document.getElementById(`brm-error-${idBsm}`);
    const okBox = document.getElementById(`brm-success-${idBsm}`);
    errBox.textContent = ''; okBox.textContent = '';
    const type_retour = Number(document.getElementById(`type_retour-${idBsm}`).value);
    const type_stock = document.querySelector(`#brm_type_stock-${idBsm} button.selected`).dataset.v;
    const lines = state.brmReturnLines
      .filter((l) => l.qty > 0)
      .map((l) => ({ id_article: l.id_article, quantite: l.qty }));

    if (!type_retour || lines.length === 0) {
      errBox.textContent = 'Choisissez un motif de retour et au moins un article avec une quantité à retourner.';
      detail.style.maxHeight = detail.scrollHeight + 'px';
      return;
    }
    try {
      const result = await api('/brm', {
        method: 'POST',
        body: { type_retour, type_stock, n_bsm: state.brmSource.id, lines }
      });
      okBox.textContent = 'Retour enregistré.';
      showToast(result.pending ? '⏳ Retour enregistré, en attente de validation' : '✓ Retour validé avec succès');
      renderBrm(); // back to the source list, refreshed with updated remaining quantities
    } catch (e) {
      errBox.textContent = e.message;
      detail.style.maxHeight = detail.scrollHeight + 'px';
    }
  }

  // Where a notification leads (also used when the user taps the push itself).
  function goToNotification(type, idRef) {
    if (!state.token || !type) return;
    const go = (tab, sub) => { state.tab = tab; if (sub) state.sub[tab] = sub; state.error = ''; state.notice = ''; renderTab(); };
    if (type === 'di_urgent') { go('maintenance', 'di'); if (Number(idRef)) openDiSheet(Number(idRef), () => renderTab()); }
    else if (type === 'fuel_alert' || type === 'fuel_no_counter') go('parc', 'alertes');
    else if (type === 'paperwork_alert') go('parc', 'papiers');
    else if (type === 'stock_alert') go('analyse', 'min');
    else if (type === 'preventive_alert') go('maintenance', 'agenda');
    else if (type === 'da_created' || type === 'da_admin') go('da', can('da.review') ? 'review' : 'mine');
    else if (type.startsWith('da_')) go('da', 'mine');
    else if (type === 'ot_close_request') { go('maintenance', 'ot'); if (Number(idRef)) openOtSheet(Number(idRef)); }
    else if (type === 'bsm_created') go('bsm', 'pending');
    else if (type.startsWith('bsm_')) go('bsm', 'history');
    else if (type === 'brm_created') go('brm', 'pending');
    else if (type.startsWith('brm_')) go('brm', 'history');
  }

  // Registers this device's push token with the backend. No-op outside the
  // native app (Capacitor isn't present in a plain browser) or if the
  // person declines the permission prompt.
  async function registerPushNotifications() {
    if (!window.Capacitor?.isNativePlatform?.()) return;
    const plugin = window.Capacitor.Plugins?.PushNotifications;
    if (!plugin) {
      console.warn('PushNotifications plugin not found on window.Capacitor.Plugins - check vendor/capacitor.js and vendor/push-notifications.js are both loading.');
      return;
    }

    try {
      const perm = await plugin.requestPermissions();
      if (perm.receive !== 'granted') return;

      // Listeners MUST be attached before calling register() - if the
      // native side reports the token before anyone's listening for it
      // (which happens often, it's fast), the event is lost for good.
      plugin.addListener('registration', async (token) => {
        // Don't call the server at every launch: only when the token or the
        // user changed, or once a week (in case the server lost it).
        const stamp = `${state.user.id}:${token.value}`;
        try {
          const prev = JSON.parse(localStorage.getItem('gmao_push_registered') || 'null');
          if (prev && prev.stamp === stamp && Date.now() - prev.at < 7 * 86400000) return;
        } catch (e) {}
        console.log('Push token received, registering with backend…');
        try {
          await api('/notifications/register-token', {
            method: 'POST',
            body: { token: token.value, platform: 'android' }
          });
          try { localStorage.setItem('gmao_push_registered', JSON.stringify({ stamp, at: Date.now() })); } catch (e) {}
          console.log('Push token registered with backend successfully.');
        } catch (e) { console.warn('Failed to register push token:', e.message); }
      });
      plugin.addListener('pushNotificationActionPerformed', (action) => {
        const data = (action && action.notification && action.notification.data) || {};
        goToNotification(String(data.type || ''), data.idRef);
      });
      plugin.addListener('registrationError', (err) => console.warn('Push registration error:', err));
      plugin.addListener('pushNotificationReceived', (notification) => {
        showToast(notification.title || notification.body || 'Nouvelle notification');
        refreshBellBadge(true);
      });

      await plugin.register();
      console.log('plugin.register() called.');
    } catch (e) {
      console.warn('Push notifications unavailable:', e.message);
    }
  }

  // Administrator screen: tick / untick every feature for one user.
  async function openPermsSheet(id, login) {
    const { sheet, close } = openSheet('<div class="empty">Chargement…</div>');
    let d;
    try { d = await api(`/permissions/users/${id}`, { fresh: true }); }
    catch (e) { sheet.innerHTML = `<div class="error">${escapeHtml(e.message)}</div><button class="ghost" id="pm-close" style="width:100%">Fermer</button>`; sheet.querySelector('#pm-close').onclick = close; return; }
    const draft = new Map(d.features.map((f) => [f.key, f.effective]));
    const orig = new Map(d.features.map((f) => [f.key, f.override]));
    const wanted = (f) => (draft.get(f.key) === f.default ? null : draft.get(f.key));   // exception to store (null = role default)
    const groups = [...new Set(d.features.map((f) => f.group))];
    const draw = () => {
      sheet.innerHTML = `
        <h2 style="margin-top:0">Droits de ${escapeHtml(d.user.login)}</h2>
        <div class="muted" style="margin-bottom:8px">Rôle : ${escapeHtml(d.user.fonction)} · les cases suivent le rôle tant que vous ne les changez pas. Une modification est appliquée en quelques secondes.</div>
        ${groups.map((g) => `<h3 style="margin:12px 0 4px">${escapeHtml(g)}</h3>${d.features.filter((f) => f.group === g).map((f) => {
          const on = draft.get(f.key); const w = wanted(f);
          return `<label class="line-item" style="align-items:center;gap:10px;cursor:pointer"><span class="line-name" style="min-width:0">${escapeHtml(f.label)}<br><span class="muted">${w == null ? 'comme le rôle' : (w ? 'autorisé (exception)' : 'refusé (exception)')}</span></span><input type="checkbox" data-k="${f.key}" ${on ? 'checked' : ''} style="width:auto;flex:none;transform:scale(1.3)"></label>`; }).join('')}`).join('')}
        <div id="pm-msg"></div>
        <button class="primary" id="pm-save" style="width:100%;margin-top:12px">Enregistrer</button>
        <button class="ghost" id="pm-reset" style="width:100%;margin-top:8px">Tout remettre comme le rôle</button>
        <button class="ghost" id="pm-close" style="width:100%;margin-top:8px">Fermer</button>`;
      sheet.querySelectorAll('input[data-k]').forEach((c) => { c.onchange = () => { draft.set(c.dataset.k, c.checked); const y = sheet.scrollTop; draw(); sheet.scrollTop = y; }; });
      sheet.querySelector('#pm-reset').onclick = () => { d.features.forEach((f) => draft.set(f.key, f.default)); draw(); };
      sheet.querySelector('#pm-close').onclick = close;
      sheet.querySelector('#pm-save').onclick = async (ev) => {
        const overrides = {};
        d.features.forEach((f) => { const w = wanted(f); if (w !== orig.get(f.key)) overrides[f.key] = w; });
        const msg = sheet.querySelector('#pm-msg');
        if (!Object.keys(overrides).length) { msg.innerHTML = '<div class="muted">Aucun changement.</div>'; return; }
        ev.currentTarget.disabled = true;
        try { await api(`/permissions/users/${id}`, { method: 'PUT', body: { overrides } }); showToast('Droits enregistrés'); close(); }
        catch (e) { ev.currentTarget.disabled = false; msg.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`; }
      };
    };
    draw();
  }

  // ---- NFC tags --------------------------------------------------------
  // A tag only carries its UID; the article it stands for is stored on the
  // server (/nfc). The native side is the small NfcUid plugin (MainActivity).
  function nfcPlugin() {
    if (!window.Capacitor?.isNativePlatform?.()) return null;
    return window.Capacitor.Plugins?.NfcUid || window.Capacitor.registerPlugin?.('NfcUid') || null;
  }

  // Opens a full-screen "hold the phone against the tag" sheet. Calls
  // onUid(uid) for every tag read until the person taps the close button.
  // onUid may return a short status string that is shown under the prompt.
  async function openNfcScanner({ title, hint, onUid }) {
    const nfc = nfcPlugin();
    if (!nfc) { showToast('Le NFC n\'est disponible que dans l\'application Android.', true); return; }
    try {
      await nfc.start();
    } catch (e) {
      const m = String(e?.message || e);
      showToast(m.includes('DISABLED') ? 'Activez le NFC dans les réglages du téléphone.'
        : m.includes('NOT_SUPPORTED') ? 'Ce téléphone n\'a pas de NFC.' : 'NFC indisponible : ' + m, true);
      return;
    }
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end';
    overlay.innerHTML = `
      <div style="background:var(--panel);width:100%;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + var(--safe-bottom));text-align:center">
        <div style="font-size:2.6rem">📡</div>
        <h2 style="margin:6px 0">${escapeHtml(title)}</h2>
        <div class="muted">${escapeHtml(hint || 'Approchez le téléphone du tag.')}</div>
        <div id="nfc-status" style="margin:14px 0;min-height:2.6em;font-weight:600"></div>
        <button class="primary" id="nfc-close">Terminer</button>
      </div>`;
    document.body.appendChild(overlay);
    const status = overlay.querySelector('#nfc-status');
    let closed = false, busy = false, last = '', lastAt = 0;
    const handle = await nfc.addListener('tag', async (ev) => {
      if (closed || !ev?.uid) return;
      // The same tag is reported repeatedly while it stays in range: ignore
      // the same UID for 1.5 s, and ignore reads while one is being handled.
      const now = Date.now();
      if (busy || (ev.uid === last && now - lastAt < 1500)) return;
      busy = true; last = ev.uid; lastAt = now;
      try {
        status.className = '';
        status.textContent = (await onUid(ev.uid)) || '✓ Tag lu';
      } catch (e) {
        status.className = 'error';
        status.textContent = e.message;
      } finally {
        busy = false;
        lastAt = Date.now();
      }
    });
    const close = () => {
      if (closed) return;
      closed = true;
      try { handle.remove(); } catch (e) {}
      nfc.stop().catch(() => {});
      overlay.remove();
    };
    overlay.querySelector('#nfc-close').onclick = close;
    return close;
  }

  function resolveNfcTag(uid) {
    return api('/nfc/resolve?uid=' + encodeURIComponent(uid));
  }

  // BSM: each scan adds the article, or +1 if it's already in the list.
  function scanIntoBsm() {
    openNfcScanner({
      title: 'Scanner les articles',
      hint: 'Un passage = +1. Passez le même tag plusieurs fois pour augmenter la quantité.',
      onUid: async (uid) => {
        const { article } = await resolveNfcTag(uid);
        const existing = state.bsmLines.find((l) => l.id === article.id);
        if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
        else state.bsmLines.push({ id: article.id, name: article.designation, qty: 1 });
        renderLines('lines', state.bsmLines);
        const l = state.bsmLines.find((x) => x.id === article.id);
        return `✓ ${article.designation} × ${l.qty}`;
      }
    });
  }

  // BRM: the first scan clears the quantities (all lines start at "return
  // everything"), then each scan adds 1 to the scanned article, capped at
  // what was issued. An article that isn't in this BSM is refused.
  function scanIntoBrm(idBsm, detail) {
    let fresh = true;
    openNfcScanner({
      title: 'Scanner les articles à retourner',
      hint: 'Un passage = +1 (maximum : la quantité sortie).',
      onUid: async (uid) => {
        const { article } = await resolveNfcTag(uid);
        const line = state.brmReturnLines.find((l) => l.id_article === article.id);
        if (!line) throw new Error(`« ${article.designation} » n'est pas dans ce BSM.`);
        if (fresh) { state.brmReturnLines.forEach((l) => { l.qty = 0; }); fresh = false; }
        if (line.qty >= line.max) throw new Error(`« ${article.designation} » : déjà ${line.max} / ${line.max}.`);
        line.qty = Math.min(line.max, (Number(line.qty) || 0) + 1);
        renderBrmReturnLines(idBsm, detail);
        return `✓ ${article.designation} × ${line.qty} / ${line.max}`;
      }
    });
  }

  // Managers: list / add / remove the tags attached to one article.
  async function openArticleTags(idArticle, designation) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:flex;align-items:flex-end';
    overlay.innerHTML = `
      <div style="background:var(--panel);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))">
        <h2 style="margin-top:0">Tags NFC</h2>
        <div class="muted" style="margin-bottom:10px">${escapeHtml(designation)}</div>
        <div id="tags-list"><div class="empty">Chargement…</div></div>
        <button class="primary" id="tags-add">📡 Associer un tag</button>
        <button class="ghost" id="tags-close" style="width:100%;margin-top:8px">Fermer</button>
      </div>`;
    document.body.appendChild(overlay);
    const list = overlay.querySelector('#tags-list');
    async function refresh() {
      try {
        const tags = await api('/nfc/article/' + idArticle);
        list.innerHTML = tags.length === 0 ? '<div class="empty">Aucun tag associé</div>' : tags.map((t) => `
          <div class="line-item">
            <div class="line-name">${escapeHtml(t.uid)}</div>
            <button class="ghost" data-uid="${escapeHtml(t.uid)}">✕</button>
          </div>`).join('');
        list.querySelectorAll('button[data-uid]').forEach((b) => {
          b.onclick = async () => {
            if (!confirm('Retirer ce tag de l\'article ?')) return;
            try { await api('/nfc/tags/' + encodeURIComponent(b.dataset.uid), { method: 'DELETE' }); refresh(); }
            catch (e) { showToast(e.message, true); }
          };
        });
      } catch (e) {
        list.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }
    overlay.querySelector('#tags-close').onclick = () => overlay.remove();
    overlay.querySelector('#tags-add').onclick = async () => {
      let closeScanner;
      closeScanner = await openNfcScanner({
        title: 'Associer un tag',
        hint: `Approchez le tag à associer à « ${designation} ».`,
        onUid: async (uid) => {
          try {
            await api('/nfc/tags', { method: 'POST', body: { uid, id_article: idArticle } });
          } catch (e) {
            // Tag already attached to another article: ask before moving it.
            if (!/déjà associé/.test(e.message) || !confirm(e.message + '\n\nLe réassigner à cet article ?')) throw e;
            await api('/nfc/tags', { method: 'POST', body: { uid, id_article: idArticle, replace: true } });
          }
          refresh();
          if (closeScanner) closeScanner();
          showToast('✓ Tag associé');
          return '✓ Tag associé';
        }
      });
    };
    refresh();
  }

  // ---- Shared widgets -----------------------------------------------
  let toastTimer = null;
  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    const bubble = toast.querySelector('.bubble');
    bubble.textContent = message;
    bubble.classList.toggle('error', isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  async function loadSelect(id, path, labelField, valueField = 'id') {
    const el = document.getElementById(id);
    try {
      const rows = await api(path);
      el.innerHTML = rows.map((r) => `<option value="${r[valueField]}">${escapeHtml(r[labelField])}</option>`).join('');
    } catch (e) {
      el.innerHTML = `<option>Erreur de chargement</option>`;
    }
  }

  function wireTypeSegmented(containerId) {
    const container = document.getElementById(containerId);
    container.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        container.querySelectorAll('button').forEach((x) => x.classList.remove('selected'));
        b.classList.add('selected');
      };
    });
  }

  function wireArticlePicker(inputId, suggestionsId, onPick) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(suggestionsId);
    let inflight = null;
    input.oninput = debounce(async () => {
      const q = input.value.trim();
      if (inflight) inflight.abort();          // a newer search replaces the old one
      if (q.length < 2) { box.innerHTML = q ? '<div class="muted">Tapez au moins 2 lettres…</div>' : ''; return; }
      inflight = new AbortController();
      try {
        const rows = await api('/articles?limit=8&search=' + encodeURIComponent(q), { signal: inflight.signal });
        box.innerHTML = rows.slice(0, 8).map((a) => `
          <div class="article-row" data-id="${a.id}" data-name="${escapeHtml(a.designation)}" style="cursor:pointer">
            <div class="name">${escapeHtml(a.designation)}</div>
            <span class="stock-pill">${(a.stock_neuf || 0) + (a.stock_use || 0)}</span>
          </div>
        `).join('');
        box.querySelectorAll('.article-row').forEach((row) => {
          row.onclick = () => {
            onPick({ id: Number(row.dataset.id), name: row.dataset.name });
            input.value = ''; box.innerHTML = '';
          };
        });
      } catch (e) {
        if (e.cancelled) return;
        box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }, 400);
  }

  function addLine(list, article, containerId) {
    if (list.some((l) => l.id === article.id)) return;
    list.push({ id: article.id, name: article.name, qty: 1 });
    renderLines(containerId || 'lines', list);
  }

  function renderLines(containerId, list) {
    const box = document.getElementById(containerId);
    if (!box) return;
    if (list.length === 0) {
      box.innerHTML = '<div class="empty">Aucun article ajouté</div>';
      return;
    }
    box.innerHTML = list.map((l, i) => `
      <div class="line-item">
        <div class="line-name">${escapeHtml(l.name)}</div>
        <input type="number" min="0.01" step="0.01" value="${l.qty}" data-idx="${i}" class="line-qty" />
        <button class="ghost" data-idx="${i}" data-action="remove">✕</button>
      </div>
    `).join('');
    box.querySelectorAll('.line-qty').forEach((inp) => {
      inp.oninput = () => { list[Number(inp.dataset.idx)].qty = Number(inp.value); };
    });
    box.querySelectorAll('[data-action=remove]').forEach((btn) => {
      btn.onclick = () => { list.splice(Number(btn.dataset.idx), 1); renderLines(containerId, list); };
    });
  }

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ---- Install prompt (Android/Chrome native prompt + iOS instructions) --
  function setupInstallBanner() {
    const banner = document.getElementById('install-banner');
    const text = document.getElementById('install-banner-text');
    const action = document.getElementById('install-banner-action');
    const close = document.getElementById('install-banner-close');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (isStandalone) return; // already installed, nothing to do

    if (localStorage.getItem('gmao_install_dismissed') === '1') return;

    close.onclick = () => {
      banner.classList.remove('show');
      localStorage.setItem('gmao_install_dismissed', '1');
    };

    const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

    if (isIos) {
      text.textContent = 'Installez cette app : appuyez sur Partager puis "Sur l\'écran d\'accueil".';
      action.style.display = 'none';
      banner.classList.add('show');
      return;
    }

    // Android/Chrome: wait for the browser's own install signal, then
    // trigger its native prompt from our button.
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      text.textContent = 'Installez Stock GMAO sur cet appareil.';
      action.textContent = 'Installer';
      action.style.display = 'inline-block';
      banner.classList.add('show');
    });

    action.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove('show');
    };
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
    });
  }

  setupInstallBanner();
  loadTheme();
  loadSession();
  render();
  if (state.token) registerPushNotifications();
  // Find the server in the background at start, when the network comes back and when the app is reopened.
  rediscoverServer();
  window.addEventListener('online', () => { findFailedAt = 0; rediscoverServer(); });
  // Wi-Fi <-> mobile data change: look for the best address again.
  try { navigator.connection?.addEventListener('change', () => { findFailedAt = 0; rediscoverServer(); }); } catch (e) { /* not supported */ }
  // After the app switched to a new server address, reload the screen that is
  // showing an error so it recovers by itself. Screens without an error are left
  // alone, so nothing a person is typing (BSM lines, report values...) is lost.
  let reloadTimer = null;
  window.addEventListener('gmao-server-changed', () => {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(() => {
      if (!state.token || !document.getElementById('main')) return;
      if (!document.querySelector('#main .error')) { refreshBellBadge(); return; }
      renderTab();
      refreshBellBadge();
    }, 400);
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rediscoverServer(); });

  // Keep the branded loading screen up just long enough to be seen (avoids
  // an ugly flash on fast devices/local networks), then fade it out.
  const MIN_SPLASH_MS = 900;
  setTimeout(() => {
    const el = document.getElementById('loading-screen');
    if (el) {
      el.classList.add('hidden');
      setTimeout(() => el.remove(), 450);
    }
  }, MIN_SPLASH_MS);
})();
</script>
